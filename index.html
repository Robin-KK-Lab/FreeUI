    'steps 最多 3 条，每条不超过 15 字。只输出 JSON。';

  const msgs=[
    {role:'system',content:sys},
    ...recentHistory.slice(-4)
  ];

  /* ★ 优先用小模型做规划，快 5-10 倍 */
  const plannerModel=AI_CONFIG.plannerModel||AI_CONFIG.model;

  /* ★ 8 秒硬超时 */
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),8000);

  try{
    const r=await fetch(AI_CONFIG.baseUrl+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal:ctrl.signal,
      body:JSON.stringify({
        model:plannerModel,
        messages:msgs,
        stream:false,
        format:'json',
        options:{
          temperature:0.2,
          num_predict:120,      // ★ 限制输出长度
          num_ctx:1024          // ★ 缩小上下文窗口，大幅加速
        }
      })
    });
    clearTimeout(timer);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const text=data.message?.content||'';
    const m=text.match(/\{[\s\S]*\}/);
    if(!m)return {type:'chat'};
    return JSON.parse(m[0]);
  }catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError'){
      console.warn('[Planner] 超时，跳过规划直接走单代理');
    }else{
      console.warn('[Planner] 失败：',e);
    }
    return {type:'chat'};
  }
}

/* ═══════════════════════════════════════════════════════════════
   LiquidOrb · 球体折射
   移植自 liquid-diamond 的斯涅尔折射，几何从金字塔换成球
   光线：入射→折射进球→内壁→折射出球→打到背景平面
   ═══════════════════════════════════════════════════════════════ */
const LiquidOrb=(function(){
  const IOR = 1.25;        // 折射率（玻璃 1.5，水 1.33，这里取折中）
  const CAMERA_Z = 3.0;    // 相机距离
  const BG_Z = -1.5;       // 背景平面位置

  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const norm=v=>{const l=Math.hypot(v[0],v[1],v[2]);return l?[v[0]/l,v[1]/l,v[2]/l]:[0,0,0];};

  /* 追踪单条光线 → 返回球背后应显示的位置（UV 0..1） */
  function traceRay(px,py){
    const r2=px*px+py*py;
    if(r2>1)return null;

    /* 球面点（单位球，球心在原点） */
    const pz=Math.sqrt(1-r2);
    const P=[px,py,pz];
    const N=P;                          // 球面法线 = 位置向量

    /* 从相机射向 P 的入射方向 */
    const camPos=[0,0,CAMERA_Z];
    const inc=norm([P[0]-camPos[0],P[1]-camPos[1],P[2]-camPos[2]]);

    /* 第一次折射：空气 → 玻璃 */
    const eta=1/IOR;
    const cosI=-dot(N,inc);
    if(cosI<0)return null;
    const k=1-eta*eta*(1-cosI*cosI);
    if(k<0)return null;
    const cosT=Math.sqrt(k);
    const r1=norm([
      eta*inc[0]+(eta*cosI-cosT)*N[0],
      eta*inc[1]+(eta*cosI-cosT)*N[1],
      eta*inc[2]+(eta*cosI-cosT)*N[2]
    ]);

    /* 内部追踪：单位球内的弦长 t = -2·(P·r1) */
    const t=-2*dot(P,r1);
    if(t<=0)return null;
    const P2=[P[0]+t*r1[0],P[1]+t*r1[1],P[2]+t*r1[2]];
    const N2=P2;

    /* 第二次折射：玻璃 → 空气 */
    const cosI2=dot(N2,r1);
    const k2=1-IOR*IOR*(1-cosI2*cosI2);
    if(k2<0)return null;
    const cosT2=Math.sqrt(k2);
    const r2v=norm([
      IOR*r1[0]-(IOR*cosI2-cosT2)*N2[0],
      IOR*r1[1]-(IOR*cosI2-cosT2)*N2[1],
      IOR*r1[2]-(IOR*cosI2-cosT2)*N2[2]
    ]);

    /* 出射光线打到背景平面 */
    if(Math.abs(r2v[2])<0.001)return null;
    const tBg=(BG_Z-P2[2])/r2v[2];
    if(tBg<=0)return null;
    const bg=[P2[0]+tBg*r2v[0],P2[1]+tBg*r2v[1],P2[2]+tBg*r2v[2]];

    /* 背景点 → UV */
    const scale=-BG_Z/CAMERA_Z;
    return {
      x:bg[0]/(2*scale)+0.5,
      y:0.5-bg[1]/(2*scale)
    };
  }

  function attach(el,opts){
    opts=opts||{};
    const id='orb-'+Math.random().toString(36).slice(2,9);

    /* SVG 位移滤镜 */
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width','0');svg.setAttribute('height','0');
    svg.style.cssText='position:absolute;pointer-events:none;width:0;height:0;overflow:hidden';
    const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
    const filter=document.createElementNS('http://www.w3.org/2000/svg','filter');
    filter.setAttribute('id',id);
    filter.setAttribute('filterUnits','userSpaceOnUse');
    filter.setAttribute('color-interpolation-filters','sRGB');
    const feImg=document.createElementNS('http://www.w3.org/2000/svg','feImage');
    feImg.setAttribute('result','map');
    feImg.setAttribute('preserveAspectRatio','none');
    const feDisp=document.createElementNS('http://www.w3.org/2000/svg','feDisplacementMap');
    feDisp.setAttribute('in','SourceGraphic');
    feDisp.setAttribute('in2','map');
    feDisp.setAttribute('xChannelSelector','R');
    feDisp.setAttribute('yChannelSelector','G');
    filter.appendChild(feImg);filter.appendChild(feDisp);
    defs.appendChild(filter);svg.appendChild(defs);
    document.body.appendChild(svg);

    const canvas=document.createElement('canvas');
    const c2d=canvas.getContext('2d',{willReadFrequently:true});

    let raf=0;
    function render(){
      raf=0;
      const w=canvas.width,h=canvas.height;
      if(!w||!h)return;
      const img=c2d.createImageData(w,h);
      const data=img.data;
      const raw=new Float32Array(w*h*2);
      let maxS=1,k=0;
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const px=(x/w)*2-1;
          const py=1-(y/h)*2;
          const hit=traceRay(px,py);
          if(hit){
            const dx=hit.x*w-x,dy=hit.y*h-y;
            if(Math.abs(dx)>maxS)maxS=Math.abs(dx);
            if(Math.abs(dy)>maxS)maxS=Math.abs(dy);
            raw[k++]=dx;raw[k++]=dy;
          }else{
            raw[k++]=0;raw[k++]=0;
          }
        }
      }
      k=0;
      for(let i=0;i<data.length;i+=4){
        data[i]  =raw[k++]/maxS*127.5+127.5;
        data[i+1]=raw[k++]/maxS*127.5+127.5;
        data[i+2]=0;
        data[i+3]=255;
      }
      c2d.putImageData(img,0,0);
      feImg.setAttribute('href',canvas.toDataURL());
      feDisp.setAttribute('scale',String(maxS));
    }

    function scheduleRender(){
      if(raf)cancelAnimationFrame(raf);
      raf=requestAnimationFrame(render);
    }

    function syncSize(){
      const r=el.getBoundingClientRect();
      const w=Math.max(2,Math.round(r.width));
      const h=Math.max(2,Math.round(r.height));
      if(canvas.width===w&&canvas.height===h)return;
      canvas.width=w;canvas.height=h;
      filter.setAttribute('x','0');filter.setAttribute('y','0');
      filter.setAttribute('width',w);filter.setAttribute('height',h);
      feImg.setAttribute('width',w);feImg.setAttribute('height',h);
      scheduleRender();
    }

    /* 保存原始 backdrop 以便卸载 */
    const baseBackdrop=el.style.backdropFilter||'';
    const baseWebkit=el.style.webkitBackdropFilter||'';

    function apply(){
      const extra=opts.extra||'blur(2px) saturate(1.35) brightness(1.08)';
      el.style.backdropFilter='url(#'+id+') '+extra;
      el.style.webkitBackdropFilter=el.style.backdropFilter;
    }
    function unapply(){
      el.style.backdropFilter=baseBackdrop;
      el.style.webkitBackdropFilter=baseWebkit;
    }

    syncSize();
    const ro=new ResizeObserver(syncSize);
    ro.observe(el);

    return{
      apply,unapply,syncSize,
      destroy(){ro.disconnect();if(raf)cancelAnimationFrame(raf);svg.remove();unapply();}
    };
  }

  return{attach};
})();

/* ─── AI 模块 ─── */
const AI=(function(){
  let active=false;
  let history=[];
  let busy=false;
  let rainbowEl=null,orbEl=null,panelEl=null,listEl=null,inputEl=null,sendBtn=null;

  function buildDom(){
    rainbowEl=document.createElement('div');
    rainbowEl.className='ai-rainbow-edge';
    screen_.appendChild(rainbowEl);

    orbEl=document.createElement('div');
    orbEl.className='ai-orb';
    orbEl.innerHTML=
      '<div class="ai-orb-core"></div>'+
      '<div class="ai-orb-glow"></div>'+
      '<div class="ai-orb-flower">'+
        '<div class="petal-group">'+
          '<div class="petal" style="--i:0"></div>'+
          '<div class="petal" style="--i:1"></div>'+
          '<div class="petal" style="--i:2"></div>'+
          '<div class="petal" style="--i:3"></div>'+
          '<div class="petal" style="--i:4"></div>'+
          '<div class="petal" style="--i:5"></div>'+
          '<div class="petal" style="--i:6"></div>'+
          '<div class="petal" style="--i:7"></div>'+
        '</div>'+
        '<div class="flower-core"></div>'+
      '</div>'+
      '<div class="ai-orb-ring"></div>';
    screen_.appendChild(orbEl);

    panelEl=document.createElement('div');
    panelEl.className='ai-panel';
    panelEl.innerHTML=
      '<div class="ai-panel-head">'+
        '<button class="ai-model-btn" type="button" id="aiModelBtn">'+
          '<span class="ai-model-dot"></span>'+
          '<span class="ai-model-name">检测中…</span>'+
          '<span class="ai-model-arrow">▼</span>'+
        '</button>'+
        '<button class="ai-panel-close" type="button">✕</button>'+
      '</div>'+
      '<div class="ai-panel-toggles">'+
        '<button class="ai-toggle-btn" id="aiTtsBtn" type="button" title="语音播报">🔊</button>'+
        '<button class="ai-toggle-btn" id="aiDeepBtn" type="button" title="深度模式（多代理）">⚡</button>'+
      '</div>'+
      '<div class="ai-model-list" id="aiModelList"></div>'+
      '<div class="ai-panel-list" id="aiList"></div>'+
      '<div class="ai-panel-input-row">'+
        '<input class="ai-panel-input" id="aiInput" type="text" placeholder="跟小飞说点什么…" autocomplete="off">'+
        '<button class="ai-panel-send" id="aiSend" type="button">↑</button>'+
      '</div>';
    screen_.appendChild(panelEl);
    listEl=panelEl.querySelector('#aiList');
    inputEl=panelEl.querySelector('#aiInput');
    sendBtn=panelEl.querySelector('#aiSend');

    orbEl.addEventListener('click',e=>{e.stopPropagation();expandPanel();});
    panelEl.querySelector('.ai-panel-close').addEventListener('click',e=>{e.stopPropagation();deactivate();});
    sendBtn.addEventListener('click',e=>{e.stopPropagation();submit();});
    inputEl.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}
      if(e.key==='Escape'){e.preventDefault();deactivate();}
    });
  }

  function addBubble(role,text){
    const b=document.createElement('div');
    b.className='ai-bubble ai-'+role;
    b.textContent=text;
    listEl.appendChild(b);
    listEl.scrollTop=listEl.scrollHeight;
    return b;
  }

  /* ─── 流式调 Ollama ─── */
  async function streamChat(messages,onChunk){
    const resp=await fetch(AI_CONFIG.baseUrl+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:AI_CONFIG.model,
        messages:messages,
        tools:AI_TOOLS,
        stream:true,
        options:{temperature:0.7}
      })
    });
    if(!resp.ok){
      const t=await resp.text().catch(()=>'');
      throw new Error('Ollama HTTP '+resp.status+' '+t.slice(0,200));
    }
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    let content='';
    const toolCalls=[];
    while(true){
      const {value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop();
      for(const line of lines){
        const s=line.trim();
        if(!s)continue;
        let json;
        try{json=JSON.parse(s);}catch(_){continue;}
        const msg=json.message;
        if(!msg)continue;
        if(msg.content){
          content+=msg.content;
          onChunk(msg.content);
        }
        if(msg.tool_calls&&msg.tool_calls.length){
          for(const tc of msg.tool_calls)toolCalls.push(tc);
        }
      }
    }
    return {content,toolCalls};
  }

  /* ─── 主流程：循环处理 tool_calls 直到有最终回复 ─── */
  /* 思维链气泡（灰色小字，不进历史） */
  function addThinking(text){
    const b=document.createElement('div');
    b.className='ai-bubble ai-ai';
    b.style.cssText='font-size:11px;opacity:.55;font-style:italic;padding:6px 12px;background:rgba(140,190,255,.06);border-color:rgba(140,190,255,.12);';
    b.textContent=text;
    listEl.appendChild(b);
    listEl.scrollTop=listEl.scrollHeight;
    return b;
  }

  async function ask(text){
    /* ★ 立刻显示用户消息 —— 不管后面什么模式都先冒出来 */
    history.push({role:'user',content:text});
    addBubble('user',text);

    // 模型就绪
    if(!AI_CONFIG.model){
      try{AI_CONFIG.model=await aiDetectModel();updateTitle();}
      catch(err){
        const e=addBubble('ai','⚠️ '+err.message);
        e.style.background='rgba(255,80,80,.14)';
        e.style.borderColor='rgba(255,80,80,.3)';
        return;
      }
    }

    // ★ 深度模式：先规划（此时 history 已包含用户消息）
    if(AI_CONFIG.deepMode){
      const think=addThinking('🧠 正在规划…');
      /* ★ 每 1 秒更新一次秒数，让用户知道没卡死 */
      let elapsed=0;
      const tick=setInterval(()=>{
        elapsed++;
        think.textContent='🧠 正在规划… ('+elapsed+'s)';
        if(elapsed>=8)think.textContent='🧠 规划超时，直接回答…';
      },1000);
      const plan=await aiPlan(history);
      clearInterval(tick);
      if(plan.type==='act'&&plan.steps&&plan.steps.length){
        think.textContent='🧠 '+(plan.reasoning||'')+' → '+plan.steps.join(' → ');
        history.push({
          role:'system',
          content:'【执行计划】'+plan.steps.join(' → ')+'\n请按此计划执行。'
        });
      }else{
        think.textContent='🧠 判断为普通对话，直接回答';
        setTimeout(()=>think.remove(),1500);
      }
    }

    for(let turn=0;turn<6;turn++){
      const messages=[{role:'system',content:AI_CONFIG.systemPrompt()}]
        .concat(history.slice(-20));

      let bubble=null;
      let acc='';
      let result;
      try{
        result=await streamChat(messages,chunk=>{
          if(!bubble)bubble=addBubble('ai','');
          acc+=chunk;
          bubble.textContent=acc;
          listEl.scrollTop=listEl.scrollHeight;
        });
      }catch(err){
        const e=addBubble('ai','⚠️ 连接失败：'+err.message);
        e.style.background='rgba(255,80,80,.14)';
        e.style.borderColor='rgba(255,80,80,.3)';
        return;
      }

      if(!result.toolCalls.length){
        const finalText=result.content||'…';
        history.push({role:'assistant',content:finalText});
        // ★ 语音播报
        speak(finalText);
        return;
      }

      history.push({
        role:'assistant',
        content:result.content||'',
        tool_calls:result.toolCalls
      });

      for(const tc of result.toolCalls){
        const name=tc.function?.name||'unknown';
        let args=tc.function?.arguments;
        if(typeof args==='string'){try{args=JSON.parse(args);}catch(_){args={};}}

        // 显示工具调用
        const tip=addThinking('⚙️ '+name+'('+JSON.stringify(args)+')');

        let toolResult;
        try{toolResult=aiExecuteTool(name,args);}
        catch(e){toolResult='执行出错：'+e.message;}
        tip.textContent='✓ '+name+' → '+toolResult.split('\n')[0];
        setTimeout(()=>{if(tip.parentNode)tip.style.opacity='.35';},800);

        history.push({role:'tool',content:String(toolResult),name:name});
      }
    }
    addBubble('ai','⚠️ 工具调用次数过多，已停止。');
  }

  function submit(){
    if(busy)return;
    const text=inputEl.value.trim();
    if(!text)return;
    inputEl.value='';
    busy=true;
    sendBtn.disabled=true;
    ask(text).finally(()=>{
      busy=false;sendBtn.disabled=false;
      setTimeout(()=>{try{inputEl.focus();}catch(_){}},50);
    });
  }

  function expandPanel(){
    if(panelEl.classList.contains('shown')){try{inputEl.focus();}catch(_){}return;}
    panelEl.classList.add('shown');
    setTimeout(()=>{try{inputEl.focus();}catch(_){}},420);
    /* ★ 首次展开才检测 Ollama */
    ensureModel();
    if(history.length===0){
      setTimeout(()=>{
        addBubble('ai','你好，我是小飞 ✦\n\n试试说：\n· 打开 WiFi\n· 换成极光壁纸\n· 打开微信\n· 帮我看看现在几点');
        history.push({role:'assistant',content:'greeting'});
      },300);
    }
  }
  function collapsePanel(){
    panelEl.classList.remove('shown');
    closeModelList();
    try{inputEl.blur();}catch(_){}
  }

  function outsideHandler(e){
    if(!active)return;
    if(panelEl.contains(e.target))return;
    if(orbEl.contains(e.target))return;
    if(panelEl.classList.contains('shown'))collapsePanel();
    else deactivate();
  }

  function activate(){
    if(active)return;
    active=true;
    rainbowEl.classList.add('show');
    orbEl.classList.add('show');
    setTimeout(()=>{document.addEventListener('pointerdown',outsideHandler,true);},80);
  }
  function deactivate(){
    if(!active)return;
    active=false;
    rainbowEl.classList.remove('show');
    orbEl.classList.remove('show');
    collapsePanel();
    document.removeEventListener('pointerdown',outsideHandler,true);
  }

  let _orbLiquid=null;

  function init(){
    buildDom();

    /* ★ AI 悬浮球挂 V7 局部玻璃 */
    if(typeof SUPPORTS_LG_BACKDROP!=='undefined'&&SUPPORTS_LG_BACKDROP&&!IS_LOW_END){
      setTimeout(()=>{
        try{
          BackdropTexture.init();
          window._orbGL=WebGLLiquidGlass.attach(orbEl,{
            refraction:0.45,
            cornerRadius:999,
            highlight:120,
            dispersion:12,
            blur:0,
            fuse:0,
            squircle:false,      /* ★ 圆形路径 */
            squircleExp:4,
          });
        }catch(e){console.warn('[LiquidGlass] AI球失败:',e);}
      },400);
    }

    // 绑定模型选择按钮
    const modelBtn=panelEl.querySelector('#aiModelBtn');
    if(modelBtn){
      modelBtn.addEventListener('click',e=>{e.stopPropagation();openModelList();});
    }

    // 语音开关
    const ttsBtn=panelEl.querySelector('#aiTtsBtn');
    if(ttsBtn){
      if(AI_CONFIG.tts)ttsBtn.classList.add('on');
      ttsBtn.addEventListener('click',e=>{
        e.stopPropagation();
        AI_CONFIG.tts=!AI_CONFIG.tts;
        ttsBtn.classList.toggle('on',AI_CONFIG.tts);
        if(!AI_CONFIG.tts){
          if(_currentAudio){try{_currentAudio.pause();}catch(_){}}
          if('speechSynthesis' in window)speechSynthesis.cancel();
        }
      });
    }

    // 深度模式开关
    const deepBtn=panelEl.querySelector('#aiDeepBtn');
    if(deepBtn){
      if(AI_CONFIG.deepMode)deepBtn.classList.add('on');
      deepBtn.addEventListener('click',e=>{
        e.stopPropagation();
        AI_CONFIG.deepMode=!AI_CONFIG.deepMode;
        deepBtn.classList.toggle('on',AI_CONFIG.deepMode);
        const b=addBubble('ai',AI_CONFIG.deepMode?'🧠 深度模式已开启：先规划，再执行':'⚡ 快速模式：直接应答');
        b.style.fontSize='11px';b.style.opacity='.7';
        b.style.background='rgba(140,190,255,.1)';
      });
    }

    // 优先用上次保存的选择
    /* ★ 只读 localStorage，不主动 fetch Ollama */
    let saved=null;
    try{saved=localStorage.getItem('ai_model');}catch(_){}
    if(saved){
      AI_CONFIG.model=saved;
      updateTitle();
      console.log('[AI] 使用上次选择：'+saved);
    }
    /* 无缓存 → 留给面板首次展开时检测 */
  }

  /* ★ 首次展开面板时做一次检测 */
  let _detectStarted=false;
  function ensureModel(){
    if(AI_CONFIG.model)return;
    if(_detectStarted)return;
    _detectStarted=true;
    updateTitle();
    aiDetectModel().then(m=>{
      AI_CONFIG.model=m;
      updateTitle();
      try{localStorage.setItem('ai_model',m);}catch(_){}
      console.log('[AI] 自动选择模型：'+m);
    }).catch(err=>{
      console.warn('[AI] 模型检测失败：',err);
      updateTitle();
      const b=addBubble('ai','⚠️ '+err.message);
      b.style.background='rgba(255,80,80,.14)';
      b.style.borderColor='rgba(255,80,80,.3)';
    });
  }

  function updateTitle(){
    const el=panelEl&&panelEl.querySelector('.ai-model-name');
    if(!el)return;
    el.textContent=AI_CONFIG.model||'检测中…';
  }

  /* ─── 拉全部模型并渲染 ─── */
  async function fetchModels(){
    try{
      const r=await fetch(AI_CONFIG.baseUrl+'/api/tags');
      if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();
      return (data.models||[]).map(m=>({
        name:m.name,
        size:m.size
      }));
    }catch(e){
      return null;
    }
  }

  function fmtSize(bytes){
    if(!bytes)return '';
    const gb=bytes/1024/1024/1024;
    if(gb>=1)return gb.toFixed(1)+'GB';
    return (bytes/1024/1024).toFixed(0)+'MB';
  }

  async function openModelList(){
    const btn=panelEl.querySelector('#aiModelBtn');
    const list=panelEl.querySelector('#aiModelList');
    // toggle
    if(list.classList.contains('shown')){
      list.classList.remove('shown');
      btn.classList.remove('open');
      return;
    }
    btn.classList.add('open');
    list.classList.add('shown');

    list.innerHTML='<div class="ai-model-empty">读取模型列表…</div>';
    const models=await fetchModels();

    if(models===null){
      list.innerHTML='<div class="ai-model-empty">⚠️ 无法连接 Ollama</div>';
      return;
    }
    if(!models.length){
      list.innerHTML='<div class="ai-model-empty">还没装任何模型<br>试试：ollama pull qwen2.5:7b</div>';
      return;
    }

    // 排序：当前在用的置顶，其余按字母
    models.sort((a,b)=>{
      if(a.name===AI_CONFIG.model)return -1;
      if(b.name===AI_CONFIG.model)return 1;
      return a.name.localeCompare(b.name);
    });

    list.innerHTML='';
    for(const m of models){
      const item=document.createElement('button');
      item.className='ai-model-item'+(m.name===AI_CONFIG.model?' active':'');
      item.type='button';
      item.innerHTML=
        '<span class="ai-model-item-name">'+m.name+
        '<span class="ai-model-item-size">'+fmtSize(m.size)+'</span></span>'+
        '<span class="ai-model-item-check">✓</span>';
      item.addEventListener('click',e=>{
        e.stopPropagation();
        switchModel(m.name);
      });
      list.appendChild(item);
    }
  }

  function switchModel(name){
    if(name===AI_CONFIG.model){
      closeModelList();
      return;
    }
    AI_CONFIG.model=name;
    try{localStorage.setItem('ai_model',name);}catch(_){}
    updateTitle();
    closeModelList();
    // 在对话里插一条系统提示
    const b=addBubble('ai','✦ 已切换到 '+name);
    b.style.background='rgba(140,190,255,.14)';
    b.style.borderColor='rgba(140,190,255,.28)';
    b.style.fontSize='11px';
    b.style.opacity='.85';
    history=[];
  }

  function closeModelList(){
    const list=panelEl&&panelEl.querySelector('#aiModelList');
    const btn=panelEl&&panelEl.querySelector('#aiModelBtn');
    if(list)list.classList.remove('shown');
    if(btn)btn.classList.remove('open');
  }

  return{init,activate,deactivate,isActive:()=>active,clear:()=>{history=[];},refreshModel:updateTitle};
})();

/* ─── 电源键：抽出锁屏逻辑，供 AI 调用 ─── */
function lockScreenAction(){
  if(STATE.mode==='lock'){showLockToast();return;}
  if(STATE.folder)closeFolderModal();
  if(STATE.spotlightOpen)closeSpotlight();
  if(STATE.miniApp)closeMiniWindow();
  if(STATE.negativeOpen)showNegativeScreen(false);
  if(STATE.libraryOpen)showAppLibrary(false);
  if(STATE.editing)exitEditMode();
  if(STATE.sheet)closeSheet();
  if(STATE.currentApp)closeApp(false);
  if(STATE.mode==='switcher')closeSwitcher(false);
  setMode('lock');
  lockScreen.style.transition='none';lockScreen.style.transform='translate3d(0, 100%, 0)';lockScreen.style.opacity='0';lockScreen.style.pointerEvents='auto';
  wallpaper_.style.filter='';
  requestAnimationFrame(()=>{lockScreen.style.transition='transform .42s var(--ease-out), opacity .35s';lockScreen.style.transform='';lockScreen.style.opacity='1';});
  playSound('关');islandText('已锁屏');
  const sr=screen_.getBoundingClientRect();
  FX.implode(sr.width/2,sr.height/2,{count:14,radius:180,hue:210});
}

/* ═══ 初始化 ═══ */
LG.init();FX.init();AI.init();
/* ★ 通知中心交互绑定 · 用 pointerdown 更可靠 */
document.addEventListener('pointerdown',e=>{
  const t=e.target;
  if(!t||typeof t.closest!=='function')return;

  /* ✕ 删除单条 */
  const closeBtn=t.closest('.nc-item-close');
  if(closeBtn){
    e.stopPropagation();
    e.preventDefault();
    Notify.removeAnimated(closeBtn.dataset.close);
    return;
  }

  /* 清空全部 */
  const clearBtn=t.closest('#ncClearAll');
  if(clearBtn){
    e.stopPropagation();
    e.preventDefault();
    Notify.clearAllAnimated();
    return;
  }

  /* 点卡片主体 */
  const item=t.closest('.nc-item');
  if(!item||!item.closest('.nc-list'))return;
  const id=item.dataset.id;
  const n=Notify.getAll().find(x=>x.id===id);
  if(!n)return;
  n.read=true;
  try{localStorage.setItem('freeui_notifications',JSON.stringify(Notify.getAll()));}catch(_){}
  Notify.render();
  if(n.action&&typeof n.action==='function')n.action();
  setTimeout(()=>closeSheet(),150);
},true);   /* ★ capture:true 抢占优先执行 */

/* 首次渲染通知 */
Notify.render();
/* ★ 通知列表滚动时顶部渐隐 */
document.addEventListener('scroll',e=>{
  const t=e.target;
  if(!t||!t.classList||!t.classList.contains('nc-list'))return;
  if(t.scrollTop>8){
    t.style.maskImage='linear-gradient(180deg,transparent 0%,#000 32px)';
    t.style.webkitMaskImage='linear-gradient(180deg,transparent 0%,#000 32px)';
  }else{
    t.style.maskImage='';
    t.style.webkitMaskImage='';
  }
},true);
setVolume(.5,{showHud:false});
negativeScreen.style.setProperty('--neg-p','0');
appLibrary.style.setProperty('--lib-p','0');
buildWidgetPickerList();
renderAll();
updateAllWidgets();
applyToggleUI();
updateClock();
setInterval(updateClock,1000);

// 环境微尘
setInterval(()=>{
  if(STATE.mode!=='home'||document.hidden)return;
  const r=screen_.getBoundingClientRect();
  FX.spawn({
    x:Math.random()*r.width,
    y:r.height+10,
    vx:(Math.random()-.5)*.15,
    vy:-(.08+Math.random()*.18),
    size:1.0+Math.random()*.8,
    hue:210+(Math.random()-.5)*30,
    alpha:.25+Math.random()*.2,
    life:4+Math.random()*3,
    decay:.004,gravity:-.002,friction:.999
  });
},320);

homeScreen.addEventListener('pointerdown',e=>{
  if(STATE.editing&&!e.target.closest('.app-icon')&&!e.target.closest('.app-widget')&&!e.target.closest('.add-widget-btn')&&!e.target.closest('.edit-toolbar'))exitEditMode();
},true);

setTimeout(()=>islandText('欢迎使用 FreeUI'),800);
waitPywebview().then(ok=>{if(ok)initPowerMonitor();else console.log('[Power] 浏览器模式');});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FreeUI · Liquid</title>
<style>
:root{--ease-spring:cubic-bezier(0.34,1.4,0.64,1);--ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in-out:cubic-bezier(0.65,0,0.35,1);--ease-ios:cubic-bezier(0.32,0,0.24,1);--grid-cols:4;--grid-rows:5;--icon-radius:22px;--icon-scale:1}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a15 100%);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
.phone{width:340px;height:720px;border-radius:48px;background:#000;padding:6px;position:relative;box-shadow:0 0 0 2px #2a2a2a,0 0 0 4px #0a0a0a,0 40px 80px rgba(0,0,0,.8),0 0 120px rgba(100,150,255,.15)}
.phone-side-btn{position:absolute;cursor:pointer;z-index:1000;background:linear-gradient(90deg,rgba(0,0,0,.45) 0%,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%,rgba(0,0,0,.45) 100%),linear-gradient(180deg,#d0d0d8 0%,#8a8a95 25%,#5a5a68 50%,#8a8a95 75%,#d0d0d8 100%);box-shadow:0 0 0 1px rgba(255,255,255,.22),0 1px 4px rgba(0,0,0,.75),inset 0 1px 2px rgba(255,255,255,.45),inset 0 -1px 2px rgba(0,0,0,.45);transition:transform .1s,filter .1s;border-radius:2px}
.phone-side-btn:active{filter:brightness(.72)}
.phone-side-btn.left{left:-8px;border-radius:4px 0 0 4px}
.phone-side-btn.right{right:-8px;border-radius:0 4px 4px 0}
.volume-up{top:126px;width:9px;height:56px}
.volume-down{top:194px;width:9px;height:56px}
.power-btn{top:166px;width:9px;height:88px}
.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;position:relative;background:#000;touch-action:none;overscroll-behavior:none;isolation:isolate}

/* ═══ 液态玻璃 ═══ */
:root{--lg-blur:30px;--lg-sat:140%;--lg-bright:1.02;--lg-base:rgba(255,255,255,.08);--lg-edge:rgba(200,220,255,.16);--lg-top:rgba(255,255,255,.55);--lg-bot:rgba(255,255,255,.16);--lg-inner:rgba(255,255,255,.06)}
:where(.lg){position:relative;isolation:isolate}
.lg{background:var(--lg-base);backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat)) brightness(var(--lg-bright));-webkit-backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat)) brightness(var(--lg-bright));box-shadow:inset 0 1px 0 0 var(--lg-top),inset 0 -1px 1px 0 var(--lg-bot),inset 0 0 0 1px var(--lg-edge),inset 0 0 40px -12px var(--lg-inner),0 12px 40px -10px rgba(0,0,0,.5),0 4px 12px -4px rgba(0,0,0,.32)}
.lg::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.34) 0%,rgba(210,225,255,.20) 30%,rgba(185,210,255,.14) 60%,rgba(255,255,255,.24) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:2;transition:opacity .35s;opacity:.9}
.lg.lg-active::before{opacity:1}
.lg::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(220px circle at var(--lg-x,30%) var(--lg-y,28%),rgba(255,255,255,.32) 0%,rgba(255,255,255,.08) 35%,transparent 65%);mix-blend-mode:screen;pointer-events:none;z-index:3;opacity:.9;transition:opacity .4s}
.lg.lg-active::after{opacity:1}
.lg>*{position:relative;z-index:4}
@property --lg-flow-x{syntax:'<percentage>';inherits:false;initial-value:20%}
@property --lg-flow-y{syntax:'<percentage>';inherits:false;initial-value:30%}
@keyframes lgFlow{0%,100%{--lg-flow-x:15%;--lg-flow-y:25%}25%{--lg-flow-x:80%;--lg-flow-y:20%}50%{--lg-flow-x:85%;--lg-flow-y:75%}75%{--lg-flow-x:25%;--lg-flow-y:80%}}
.phone .lg::after{background:radial-gradient(220px circle at var(--lg-x,30%) var(--lg-y,28%),rgba(255,255,255,.32) 0%,rgba(255,255,255,.08) 35%,transparent 65%),radial-gradient(180px circle at var(--lg-flow-x) var(--lg-flow-y),rgba(220,235,255,.10) 0%,transparent 62%);animation:lgFlow 18s ease-in-out infinite}
.low-end{--lg-blur:14px;--lg-sat:120%}

/* ═══ 壁纸 / 环境光晕 ═══ */
.wallpaper{position:absolute;inset:0;z-index:0;background:#16213e center/cover no-repeat;background-image:url('assets/6c273edb7188c369decf6fda036118f5.png'),linear-gradient(160deg,#1a1a2e 0%,#16213e 35%,#0f3460 65%,#533483 100%);background-size:cover,cover;background-position:center;transform-origin:center center;backface-visibility:hidden;transition:filter .55s var(--ease-out),transform .55s var(--ease-out),background-image .6s ease,opacity .5s}
.wallpaper.bg-anim{transition:none;will-change:filter,transform}
body[data-mode="lock"] .wallpaper{filter:blur(3.5px) brightness(.86) saturate(.95)}
.ambient-glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle 340px at var(--gx,50%) var(--gy,50%),rgba(120,180,255,.28) 0%,rgba(160,120,255,.14) 35%,rgba(100,200,255,.05) 58%,transparent 75%);mix-blend-mode:screen;transition:opacity .45s var(--ease-out)}
.drag-aura{position:absolute;top:0;left:0;width:300px;height:300px;margin-left:-150px;margin-top:-150px;border-radius:50%;pointer-events:none;z-index:1;opacity:0;transition:opacity .4s;mix-blend-mode:screen;filter:blur(14px);will-change:transform,opacity}
.lock-sheen{position:absolute;inset:0;pointer-events:none;z-index:410;opacity:0;background:linear-gradient(180deg,transparent 0%,rgba(200,225,255,.55) 45%,rgba(230,240,255,.85) 50%,rgba(200,225,255,.55) 55%,transparent 100%);background-size:100% 220%;background-position:50% 100%;mix-blend-mode:screen;transition:opacity .35s}

/* ═══ 状态栏 / 灵动岛 ═══ */
.status-bar{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;font-size:14px;font-weight:600;z-index:100;pointer-events:none}
.status-right{display:flex;align-items:center;gap:6px}
.signal{display:flex;align-items:flex-end;gap:2px;height:11px;animation:signalPulse 1.8s ease-in-out infinite}
.signal .bar{width:3px;background:#fff;border-radius:1px;display:block}
.signal .bar:nth-child(1){height:4px}.signal .bar:nth-child(2){height:6px}.signal .bar:nth-child(3){height:8.5px}.signal .bar:nth-child(4){height:11px}
@keyframes signalPulse{0%,100%{opacity:1}50%{opacity:.55}}
.battery{width:22px;height:11px;border:1.5px solid rgba(255,255,255,.85);border-radius:3px;position:relative;padding:1.5px}
.battery::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:rgba(255,255,255,.85);border-radius:0 1px 1px 0}
.battery-level{width:80%;height:100%;background:#fff;border-radius:1px;transition:width .3s,background .3s}
.battery.charging .battery-level{background:#34c759}
.island-slot{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:320}
.dynamic-island{position:relative;width:92px;height:26px;background:#000;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;pointer-events:auto;transform-origin:center center;transition:width .5s var(--ease-spring),height .5s var(--ease-spring),border-radius .5s,background .3s}
.dynamic-island.expanded{width:210px;height:54px;border-radius:20px}
.dynamic-island.detail{width:280px;height:96px;border-radius:24px}
.dynamic-island.expanded,.dynamic-island.detail{
  background:rgba(28,32,44,.42);
  backdrop-filter:blur(40px) saturate(200%) brightness(1.15);
  -webkit-backdrop-filter:blur(40px) saturate(200%) brightness(1.15);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.65),
    inset 0 -1px 0 0 rgba(255,255,255,.12),
    inset 0 0 32px -8px rgba(140,190,255,.4),
    0 16px 40px -10px rgba(0,0,0,.6),
    0 0 32px -6px rgba(120,180,255,.35);
}
/* 棱镜描边 · 1px 彩虹细边 */
@keyframes islandPrism{
  0%,100%{filter:hue-rotate(0deg)}
  50%{filter:hue-rotate(25deg)}
}
.dynamic-island.expanded::before,
.dynamic-island.detail::before{
  content:'';
  position:absolute;inset:0;border-radius:inherit;
  padding:1px;
  background:linear-gradient(120deg,
    rgba(255,140,210,.5) 0%,
    rgba(180,160,255,.45) 20%,
    rgba(140,200,255,.5) 40%,
    rgba(160,255,240,.45) 60%,
    rgba(180,200,255,.4) 80%,
    rgba(255,180,230,.5) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:1;
  z-index:2;
  animation:islandPrism 8s ease-in-out infinite;
}
/* 顶部斜切高光 */
.dynamic-island.expanded::after,
.dynamic-island.detail::after{
  content:'';
  position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,
    rgba(255,255,255,.42) 0%,
    rgba(255,255,255,.10) 30%,
    transparent 55%);
  pointer-events:none;
  mix-blend-mode:screen;
  z-index:3;
}
.dynamic-island span{position:relative;z-index:5;opacity:0;animation:islandText .3s .15s forwards}
@keyframes islandText{to{opacity:1}}
@keyframes islandLiquidExpand{0%{transform:scale(1,1);border-radius:14px}28%{transform:scale(1.04,1.26);border-radius:18px}58%{transform:scale(0.99,0.92);border-radius:22px}80%{transform:scale(1.01,1.03);border-radius:20px}100%{transform:scale(1,1);border-radius:20px}}
@keyframes islandLiquidDetail{0%{transform:scale(1,1)}30%{transform:scale(1.06,1.18)}60%{transform:scale(0.98,0.95)}100%{transform:scale(1,1)}}
@keyframes islandLiquidCollapse{0%{transform:scale(1,1)}40%{transform:scale(0.93,0.86)}100%{transform:scale(1,1)}}
.dynamic-island.liquid-expand{animation:islandLiquidExpand .78s cubic-bezier(.34,1.4,.64,1)}
.dynamic-island.liquid-detail{animation:islandLiquidDetail .72s cubic-bezier(.34,1.4,.64,1)}
.dynamic-island.liquid-collapse{animation:islandLiquidCollapse .55s cubic-bezier(.34,1.4,.64,1)}

.dynamic-island .island-detail{width:100%;height:100%;display:none;flex-direction:column;padding:12px 16px;gap:6px;position:relative;z-index:5}
.dynamic-island.detail .island-detail{display:flex}
.dynamic-island.detail>span{display:none}
.island-detail-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;opacity:.9}
.island-detail-app{font-size:13px;font-weight:600}
.island-detail-sub{font-size:10px;opacity:.6}
.island-detail-actions{display:flex;gap:8px;margin-top:auto}
.island-detail-btn{flex:1;height:26px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;font-size:10px;font-family:inherit;cursor:pointer}
.island-detail-btn:active{background:rgba(255,255,255,.22)}

/* ═══ 锁屏 ═══ */
.lock-screen{position:absolute;inset:0;z-index:400;display:flex;flex-direction:column;align-items:center;padding-top:130px;color:#fff;will-change:transform,opacity;cursor:grab;touch-action:none}
.lock-screen.grabbing{cursor:grabbing}
.lock-time-img{height:56px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 12px rgba(0,0,0,.35))}
.lock-time-img img{height:56px;width:auto;display:block;margin:0 -18px}
.lock-time-img img:first-child{margin-left:0}
.lock-time-img img:last-child{margin-right:0}
.lock-date{font-size:15px;margin-top:14px;opacity:.85;letter-spacing:.5px}
.lock-hint{position:absolute;bottom:40px;font-size:13px;opacity:.6;animation:hintFloat 2.4s ease-in-out infinite}
@keyframes hintFloat{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:.9}}

/* ═══ 桌面 ═══ */
.home-screen{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity .35s}
body[data-mode="home"] .home-screen,body[data-mode="app"] .home-screen,body[data-mode="switcher"] .home-screen{opacity:1;pointer-events:auto}
.negative-screen{position:absolute;inset:0;z-index:1;transform:translate3d(-100%,0,0);will-change:transform;background:rgba(255,255,255,.06);backdrop-filter:blur(8px) saturate(180%);-webkit-backdrop-filter:blur(8px) saturate(180%);padding:66px 14px 130px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;color:#fff;contain:layout style paint}
.negative-screen::-webkit-scrollbar{display:none}
.neg-header,.neg-card,.neg-section-title{opacity:calc(0.35 + var(--neg-p,0)*0.65);transform:translateX(calc((1 - var(--neg-p,0))*-14px))}
.neg-header{padding:6px 4px 10px}
.neg-date-big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-2px}
.neg-date-sub{font-size:13px;opacity:.75;margin-top:4px}
.neg-card{border-radius:22px;padding:14px 16px}
.neg-weather-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:5}
.neg-weather-city{font-size:13px;font-weight:600}
.neg-weather-desc{font-size:11px;opacity:.65;margin-top:2px}
.neg-weather-icon{font-size:26px}
.neg-weather-temp{font-size:40px;font-weight:300;letter-spacing:-2px;margin:8px 0 2px;position:relative;z-index:5}
.neg-weather-range{font-size:11px;opacity:.65;position:relative;z-index:5}
.neg-toggles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.neg-toggle{background:rgba(255,255,255,.08);border:none;border-radius:14px;padding:10px 4px;color:#fff;font-size:10px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .2s,transform .15s,box-shadow .3s;position:relative;z-index:5}
.neg-toggle:active{transform:scale(.94)}
.neg-toggle.on{background:rgba(10,132,255,.9);box-shadow:0 0 16px rgba(10,132,255,.7),0 0 34px rgba(10,132,255,.4),0 0 56px rgba(10,132,255,.2),inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 10px rgba(255,255,255,.16)}
.neg-toggle .neg-t-icon{font-size:18px;line-height:1}
.neg-section-title{padding:4px 6px 0;font-size:12px;opacity:.7;letter-spacing:.5px}
.neg-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;padding:12px}
.neg-app{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:12px;padding:6px 0;position:relative;z-index:5}
.neg-app:active{background:rgba(255,255,255,.08)}
.neg-app-icon{
  width:46px;height:46px;border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  flex-shrink:0;
}
.neg-app-icon img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  transform:scale(2.85);
  transform-origin:center;
}
/* 天气/日历特例 —— 满屏底色图标不裁 */
.neg-app[data-id="天气"] .neg-app-icon img,
.neg-app[data-id="日历"] .neg-app-icon img{
  object-fit:contain;
  transform:none;
}
.neg-app span{font-size:10px;opacity:.9;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}

/* ═══ 桌面网格（支持动态行列） ═══ */
.app-pages{position:absolute;top:62px;left:0;right:0;bottom:124px;display:flex;will-change:transform,opacity,filter;transform-origin:50% 50%;transition:top .3s,bottom .3s}
.app-page{flex:0 0 100%;width:100%;padding:0 4px;display:grid;grid-template-columns:repeat(var(--grid-cols,4),1fr);grid-template-rows:repeat(var(--grid-rows,5),1fr);gap:12px 2px;box-sizing:border-box;transition:grid-template-columns .35s var(--ease-out),grid-template-rows .35s var(--ease-out)}
.page-dots{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:15;pointer-events:none}
.page-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .25s}
.page-dots .dot.active{background:#fff}
.app-widget{position:relative;border-radius:20px;padding:14px;color:#fff;cursor:pointer;touch-action:none;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .15s}
.app-widget>*{position:relative;z-index:5}
.app-widget:active{transform:scale(.98)}
.app-widget.editing{animation:iconJiggle .3s ease-in-out infinite;animation-delay:var(--jiggle-delay,0s)}
.app-widget.widget-clock{background:linear-gradient(145deg,rgba(80,60,160,.4),rgba(40,30,90,.55))}
.app-widget.widget-weather{background:linear-gradient(145deg,rgba(60,140,220,.38),rgba(30,60,140,.52))}
.app-widget.widget-battery{flex-direction:row;align-items:center;gap:14px;padding:12px 14px;background:linear-gradient(145deg,rgba(60,180,90,.35),rgba(20,80,50,.5))}
.app-widget.widget-music{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(145deg,rgba(220,60,120,.35),rgba(100,20,60,.52))}
.widget-clock .w-clock-top{display:flex;flex-direction:column;gap:2px}
.widget-clock .w-time{font-size:46px;font-weight:200;letter-spacing:-2px;line-height:1}
.widget-clock .w-date{font-size:11px;opacity:.75;margin-top:6px}
.widget-clock .w-week{font-size:14px;font-weight:500;opacity:.9}
.widget-weather .w-weather-top{display:flex;justify-content:space-between;align-items:flex-start}
.widget-weather .w-city{font-size:13px;font-weight:600}
.widget-weather .w-icon{font-size:34px}
.widget-weather .w-temp{font-size:44px;font-weight:200;letter-spacing:-2px;line-height:1}
.widget-weather .w-desc{font-size:11px;opacity:.75;margin-top:4px}
.w-battery-ring{width:44px;height:44px;border-radius:50%;position:relative;flex-shrink:0;background:conic-gradient(#fff calc(var(--p,50)*1%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center}
.w-battery-ring::after{content:'';position:absolute;inset:4px;background:rgba(20,30,40,.7);border-radius:50%}
.w-battery-num{position:relative;z-index:1;font-size:12px;font-weight:600}
.w-battery-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.w-battery-title{font-size:13px;font-weight:600}
.w-battery-sub{font-size:10px;opacity:.75}
.w-music-art{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#ff5a8a,#8a2050);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.w-music-info{flex:1;min-width:0}
.w-music-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-music-artist{font-size:10px;opacity:.75;margin-top:2px}
.w-music-play{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.app-widget .delete-btn,.app-icon .delete-btn{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:rgba(255,59,48,.98);color:#fff;border:2px solid rgba(255,255,255,.95);font-size:12px;font-weight:bold;cursor:pointer;z-index:20;display:none;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.4);font-family:inherit}
.app-widget.editing .delete-btn,.app-icon.editing .delete-btn{display:flex}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;touch-action:none;position:relative;width:100%}
.app-icon .icon-img{width:calc(80% * var(--icon-scale));aspect-ratio:1/1;height:auto;border-radius:var(--icon-radius);display:flex;align-items:center;justify-content:center;background:transparent;overflow:hidden;position:relative;isolation:isolate;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s,border-radius .3s}
.app-icon .icon-img img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;transform:scale(2.85);transform-origin:center}
.app-icon .icon-label{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;pointer-events:none}
.app-icon.folder-icon .icon-img{
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:6px;
  box-sizing:border-box;
  border:none;
  overflow:visible;
}
.folder-wave{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:visible;
  z-index:2;
}
.folder-wave-fill{
  fill:rgba(255,255,255,.05);
  stroke:none;
}
.folder-wave-stroke{
  fill:none;
  stroke:rgba(255,255,255,.55);
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 3px rgba(200,220,255,.5));
  vector-effect:non-scaling-stroke;
}
.app-icon.folder-icon .folder-preview{
  position:relative;
  z-index:3;
}
/* 大文件夹（2×2 格） */
/* ★ 大文件夹：去掉所有 CSS 背景和圆角，形状完全由 SVG path 控制 */
.app-icon.large-folder .icon-img{
  width:100%;
  height:100%;
  aspect-ratio:1/1;
  border-radius:26px;   /* ★ 和 SVG 内部的圆角一致，让 drop-target 的光圈也圆润 */
  padding:0;
  background:none;
  box-shadow:none;
  overflow:visible;
  outline:none !important;
}
/* ★ 干掉大文件夹和 ghost 的所有 focus outline / 高亮 */
.app-icon.large-folder,
.app-icon.large-folder *,
.drag-ghost,
.drag-ghost *,
.drag-ghost.large-folder,
.drag-ghost.large-folder *{
  outline:none !important;
  -webkit-tap-highlight-color:transparent !important;
  -webkit-focus-ring-color:transparent !important;
}
.app-icon.large-folder .folder-wave{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
  z-index:1;
}
.app-icon.large-folder .folder-wave path{
  fill:rgba(255,255,255,.13);
  stroke:rgba(255,255,255,.45);
  stroke-width:1.2;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 4px 12px rgba(120,170,240,.22));
}
.app-icon.large-folder .folder-preview{
  position:absolute;
  inset:14px;
  z-index:2;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:6px;
  width:auto;
  height:auto;
}
.app-icon.large-folder .folder-mini{
  position:relative;      /* ★ 给 img 绝对定位的参照 */
  border-radius:12px;
  background:rgba(255,255,255,.13);
  overflow:hidden;
}
.app-icon.large-folder .folder-mini.empty{
  background:rgba(255,255,255,.06);
  border:1px dashed rgba(255,255,255,.18);
}
.app-icon.large-folder .folder-mini img{
  position:absolute;      /* ★ 铺满整个 mini */
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(2.2);
  transform-origin:center;
  display:block;
}
.folder-preview{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;width:100%;height:100%}
.folder-mini{background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.folder-mini img{width:100%;height:100%;object-fit:cover;display:block;transform:none}
.folder-mini.empty{background:rgba(255,255,255,.06)}
.app-icon.drop-target .icon-img{transform:scale(1.2);animation:dropTargetPulse 1.1s ease-in-out infinite}
@keyframes dropTargetPulse{0%,100%{box-shadow:0 0 0 3px rgba(10,132,255,.75),0 8px 24px rgba(10,132,255,.4)}50%{box-shadow:0 0 0 6px rgba(10,132,255,.9),0 8px 30px rgba(10,132,255,.55)}}
@keyframes iconJiggle{0%{transform:rotate(0deg)}25%{transform:rotate(-1.8deg) translate(-.8px,-1px)}50%{transform:rotate(0deg)}75%{transform:rotate(1.8deg) translate(.8px,1px)}100%{transform:rotate(0deg)}}
.app-icon.editing{animation:iconJiggle .3s ease-in-out infinite;animation-delay:var(--jiggle-delay,0s)}
.app-icon.dragging,.app-widget.dragging{animation:none;z-index:9999;transition:none!important;position:absolute!important;visibility:hidden;pointer-events:none}
.app-icon.dragging .icon-img{transform:scale(1.15);box-shadow:0 16px 40px rgba(0,0,0,.6)}
.app-icon.long-pressing{transition:transform .2s;transform:scale(.92)}
.app-widget.long-pressing{transition:transform .2s;transform:scale(.97)}
@keyframes iconFlyIn{0%{opacity:0;transform:translate(var(--from-x),var(--from-y)) scale(.2)}60%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1)}}
.app-icon.flying{animation:iconFlyIn .55s var(--ease-spring) backwards}

/* ═══ Dock ═══ */
.dock{position:absolute!important;bottom:22px;left:14px;right:14px;height:86px;border-radius:26px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;z-index:20;overflow:hidden;transition:box-shadow .25s,background .25s}
.dock .app-icon{position:relative;z-index:5;gap:0;width:auto}
.dock .app-icon .delete-btn{display:none!important}
.dock .icon-img{width:72px;height:72px}
.dock .icon-img img{transform:scale(1.1)}
.dock .icon-label{display:none}
.dock.dock-hover{box-shadow:inset 0 0 0 2px rgba(120,200,255,.75),0 12px 40px -10px rgba(0,0,0,.6),0 0 30px -5px rgba(120,200,255,.5)}
.dock.dock-self{box-shadow:inset 0 0 0 2px rgba(120,200,255,.4),0 12px 40px -10px rgba(0,0,0,.6)}
.dock.dock-full{box-shadow:inset 0 0 0 2px rgba(255,140,140,.7),0 12px 40px -10px rgba(0,0,0,.6)}
.home-indicator{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:5px;background:#fff;border-radius:3px;z-index:999;opacity:.85;touch-action:none;cursor:grab}
.home-indicator.hidden{opacity:0;pointer-events:none}

/* ═══ 应用资源库 ═══ */
.app-library{position:absolute;inset:0;z-index:25;transform:translate3d(100%,0,0);will-change:transform;display:flex;flex-direction:column;background:rgba(255,255,255,.06);backdrop-filter:blur(8px) saturate(180%);-webkit-backdrop-filter:blur(8px) saturate(180%);color:#fff;padding:56px 14px 0;overflow:hidden;contain:layout style paint}
.app-library-header{flex-shrink:0;padding-bottom:14px;position:relative;z-index:5}
.app-library-title{font-size:22px;font-weight:700;letter-spacing:.3px;margin-bottom:12px}
.app-library-search{
  display:flex;align-items:center;gap:8px;border-radius:16px;padding:10px 12px;
  background:rgba(255,255,255,.10) !important;
  backdrop-filter:blur(8px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(8px) saturate(180%) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 6px 20px -6px rgba(0,0,0,.3) !important;
  --lg-blur:0px !important;
}
.app-library-search svg{opacity:.65;flex-shrink:0;position:relative;z-index:5}
.app-library-search input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:14px;min-width:0;position:relative;z-index:5}
.app-library-search input::placeholder{color:rgba(255,255,255,.45)}
.app-library-content{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:130px;display:flex;flex-direction:column;gap:20px;position:relative;z-index:5}
.app-library-content::-webkit-scrollbar{display:none}
.lib-category{display:flex;flex-direction:column;gap:10px}
.lib-cat-title{font-size:13px;font-weight:600;opacity:.82;letter-spacing:.4px;padding-left:4px}
.lib-cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.lib-app{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:6px 0;border-radius:12px}
.lib-app:active{background:rgba(255,255,255,.1)}
.lib-app-icon{
  width:56px;height:56px;border-radius:14px;
  overflow:hidden;
  display:block;
  box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
  flex-shrink:0;
}
.lib-app-icon img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  transform:scale(2.85);
  transform-origin:center;
}
/* 天气/日历特例 */
.lib-app[data-id="天气"] .lib-app-icon img,
.lib-app[data-id="日历"] .lib-app-icon img{
  object-fit:contain;
  transform:none;
}
.lib-app span{font-size:10px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;opacity:.55;font-size:13px;gap:6px}

/* ═══ 弹窗 ═══ */
.folder-modal,.rename-modal,.widget-picker,.confirm-sheet,.widget-menu,.grid-picker,.theme-picker{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;z-index:770}
.folder-modal.visible,.rename-modal.visible,.widget-picker.visible,.confirm-sheet.visible,.widget-menu.visible,.grid-picker.visible,.theme-picker.visible{pointer-events:auto}
.folder-modal.shown,.rename-modal.shown,.widget-picker.shown,.confirm-sheet.shown,.widget-menu.shown,.grid-picker.shown,.theme-picker.shown{opacity:1}
.folder-modal{z-index:760;display:flex;align-items:center;justify-content:center}
.rename-modal{z-index:780;display:flex;align-items:center;justify-content:center}
.widget-picker,.grid-picker,.theme-picker{display:flex;align-items:flex-end;justify-content:center}
.confirm-sheet{z-index:785;display:flex;align-items:flex-end;justify-content:center}
.widget-menu{z-index:790;display:flex;align-items:flex-end;justify-content:center}
.folder-modal-backdrop,.rename-modal-backdrop,.widget-picker-backdrop,.confirm-sheet-backdrop,.widget-menu-backdrop,.grid-picker-backdrop,.theme-picker-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.15)}
.widget-menu-backdrop,.confirm-sheet-backdrop,.grid-picker-backdrop,.theme-picker-backdrop{background:rgba(0,0,0,.45)}
.folder-modal-panel{position:relative;width:320px;border-radius:28px;padding:20px 18px 16px;transform:scale(.86);opacity:0;transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .25s}
.folder-modal.shown .folder-modal-panel{transform:scale(1);opacity:1}
.folder-modal-name{font-size:18px;font-weight:600;color:#fff;text-align:center;margin-bottom:14px;outline:none;padding:4px 8px;border-radius:8px;position:relative;z-index:5}
.folder-modal-name:focus{background:rgba(255,255,255,.1)}
/* ★ 文件夹视口（固定高度，clip 溢出） */
.folder-modal-grid{
  position:relative;
  height:300px;        /* ★ 260 → 300 */
  overflow:hidden;
  margin-bottom:0;
  z-index:5;
  border-radius:14px;
}

/* ★ 每一页 */
.folder-page{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:4px 6px;         /* ★ 行间距 10 → 4，给文字腾空间 */
  will-change:transform,opacity;
  backface-visibility:hidden;
}

/* ★ 翻页动画 */
@keyframes folderSlideOutLeft{
  from{transform:translate3d(0,0,0);opacity:1}
  to{transform:translate3d(-100%,0,0);opacity:0}
}
@keyframes folderSlideOutRight{
  from{transform:translate3d(0,0,0);opacity:1}
  to{transform:translate3d(100%,0,0);opacity:0}
}
@keyframes folderSlideInRight{
  from{transform:translate3d(100%,0,0);opacity:0}
  to{transform:translate3d(0,0,0);opacity:1}
}
@keyframes folderSlideInLeft{
  from{transform:translate3d(-100%,0,0);opacity:0}
  to{transform:translate3d(0,0,0);opacity:1}
}
.folder-page.slide-out-left{animation:folderSlideOutLeft .42s cubic-bezier(.4,0,.6,1) forwards}
.folder-page.slide-out-right{animation:folderSlideOutRight .42s cubic-bezier(.4,0,.6,1) forwards}
.folder-page.slide-in-right{animation:folderSlideInRight .42s cubic-bezier(.4,0,.6,1) forwards}
.folder-page.slide-in-left{animation:folderSlideInLeft .42s cubic-bezier(.4,0,.6,1) forwards}
.folder-cell{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;cursor:pointer;
  padding:4px 0 6px;   /* ★ 底部留 6px 给文字 */
  border-radius:10px;
  touch-action:none;
  min-height:0;
}
.folder-cell-img{
  width:56px;height:56px;
  border-radius:16px;
  overflow:hidden;      /* ★ 只有图标被裁 */
  flex-shrink:0;
}
.folder-cell-img img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transform:scale(2.85);
  transform-origin:center;
}
.folder-cell[data-id="天气"] .folder-cell-img img,
.folder-cell[data-id="日历"] .folder-cell-img img{
  transform:none;
  object-fit:contain;
}
.folder-cell span{font-size:10px;color:#fff;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.folder-cell-del{position:absolute;top:-2px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(255,59,48,.9);color:#fff;border:none;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.folder-cell:hover .folder-cell-del{display:flex}
.folder-modal-nav{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 4px 12px;
  position:relative;z-index:5;
  min-height:32px;
}
.folder-nav-arrow{
  width:28px;height:28px;border-radius:50%;
  border:none;background:rgba(255,255,255,.1);
  color:#fff;font-size:18px;font-weight:600;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .18s,transform .15s,opacity .2s;
  line-height:1;
}
.folder-nav-arrow:active{background:rgba(255,255,255,.22);transform:scale(.9)}
.folder-nav-arrow[disabled]{opacity:.25;pointer-events:none}
.folder-modal-dots{
  display:flex;gap:6px;align-items:center;
}
.folder-modal-dots .f-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.32);
  transition:background .25s,transform .25s;
  cursor:pointer;
}
.folder-modal-dots .f-dot.active{background:#fff;transform:scale(1.3)}
.folder-modal-close{width:100%;height:40px;border-radius:20px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;position:relative;z-index:5}
.rename-modal-panel{position:relative;width:260px;border-radius:24px;padding:22px 18px 16px;transform:scale(.88);opacity:0;transition:transform .32s cubic-bezier(.34,1.4,.64,1),opacity .22s}
.rename-modal.shown .rename-modal-panel{transform:scale(1);opacity:1}
.rename-modal-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.72);text-align:center;margin-bottom:14px;position:relative;z-index:5}
.rename-modal-input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.1);color:#fff;font-family:inherit;font-size:15px;outline:none;box-sizing:border-box;position:relative;z-index:5}
.rename-modal-input:focus{border-color:rgba(10,132,255,.85);box-shadow:0 0 0 3px rgba(10,132,255,.22)}
.rename-modal-actions{display:flex;gap:8px;margin-top:16px;position:relative;z-index:5}
.rename-modal-btn{flex:1;height:40px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
.rename-modal-btn.cancel{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.rename-modal-btn.confirm{background:#0a84ff;color:#fff}

/* 小组件菜单 */
.widget-menu-panel{position:relative;width:100%;padding:20px 22px 30px;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.4,.64,1);color:#fff}
.widget-menu.shown .widget-menu-panel{transform:translateY(0)}
.widget-menu-title{font-size:14px;font-weight:600;text-align:center;margin-bottom:6px;position:relative;z-index:5}
.widget-menu-sub{font-size:11px;opacity:.6;text-align:center;margin-bottom:16px;position:relative;z-index:5}
.widget-menu-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:5}
.widget-menu-btn{height:56px;border-radius:16px;border:none;font-family:inherit;font-size:13px;font-weight:500;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,.1);transition:background .2s}
.widget-menu-btn:active{background:rgba(255,255,255,.2)}
.widget-menu-btn.danger{background:rgba(255,59,48,.2);color:#ff9a95}
.widget-menu-btn .wm-icon{font-size:20px;line-height:1}
.widget-menu-btn .wm-sub{font-size:9px;opacity:.6}

/* 尺寸选择气泡（在 widget 上方浮动） */
.size-popover{position:absolute;z-index:800;pointer-events:auto;transform-origin:bottom center;transform:scale(.85);opacity:0;transition:transform .3s cubic-bezier(.34,1.4,.64,1),opacity .2s}
.size-popover.shown{transform:scale(1);opacity:1}
.size-popover-inner{padding:8px;border-radius:16px;display:flex;gap:6px;align-items:center}
.size-btn{width:44px;height:44px;border-radius:10px;border:none;background:rgba(255,255,255,.1);cursor:pointer;position:relative;transition:background .2s;color:#fff;font-family:inherit;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.size-btn:hover,.size-btn.active{background:rgba(10,132,255,.55)}
.size-btn .size-prev{display:grid;gap:1px;width:22px;height:22px;background:rgba(255,255,255,.2);border-radius:3px;padding:2px}
.size-btn .size-prev .cell{background:rgba(255,255,255,.75);border-radius:1px}
.size-btn span{opacity:.85}

/* 网格设置 */
.grid-picker-panel{position:relative;width:100%;padding:22px 20px 34px;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.4,.64,1);color:#fff}
.grid-picker.shown .grid-picker-panel{transform:translateY(0)}
.grid-picker-title{font-size:14px;font-weight:600;text-align:center;margin-bottom:18px;position:relative;z-index:5}
.grid-picker-row{display:flex;align-items:center;justify-content:space-between;padding:10px 6px;position:relative;z-index:5}
.grid-picker-row+.grid-picker-row{margin-top:6px}
.grid-picker-label{font-size:13px;opacity:.85;display:flex;flex-direction:column;gap:2px}
.grid-picker-label small{font-size:10px;opacity:.5}
.grid-picker-val{font-size:15px;font-weight:600;color:#0a84ff;font-variant-numeric:tabular-nums;margin-right:12px}
.grid-picker-slider{-webkit-appearance:none;appearance:none;width:150px;height:24px;background:transparent;outline:none}
.grid-picker-slider::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.18);border-radius:2px}
.grid-picker-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.grid-picker-slider::-moz-range-track{height:4px;background:rgba(255,255,255,.18);border-radius:2px}
.grid-picker-slider::-moz-range-thumb{width:22px;height:22px;background:#fff;border-radius:50%;border:none;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.grid-picker-presets{display:flex;gap:8px;margin-top:18px;justify-content:center;position:relative;z-index:5}
.grid-preset{padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:12px;cursor:pointer;transition:background .2s}
.grid-preset:hover,.grid-preset.active{background:rgba(10,132,255,.5);border-color:rgba(10,132,255,.8)}

/* 主题设置 */
.theme-picker-panel{position:relative;width:100%;padding:22px 20px 34px;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.4,.64,1);color:#fff;max-height:70vh;display:flex;flex-direction:column}
.theme-picker.shown .theme-picker-panel{transform:translateY(0)}
.theme-picker-title{font-size:14px;font-weight:600;text-align:center;margin-bottom:6px;position:relative;z-index:5}
.theme-picker-sub{font-size:11px;opacity:.6;text-align:center;margin-bottom:18px;position:relative;z-index:5}
.theme-section{position:relative;z-index:5;margin-bottom:16px}
.theme-section-title{font-size:12px;opacity:.7;margin-bottom:10px;letter-spacing:.4px}
.wallpaper-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wallpaper-item{aspect-ratio:9/16;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
.wallpaper-item:hover{transform:scale(1.05)}
.wallpaper-item.active{border-color:#0a84ff;box-shadow:0 0 12px rgba(10,132,255,.5)}
.shape-row{display:flex;gap:10px}
.shape-item{flex:1;aspect-ratio:1/1;border-radius:16px;background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:background .2s,border-color .2s;padding:14px;box-sizing:border-box}
.shape-item:hover{background:rgba(255,255,255,.15)}
.shape-item.active{border-color:#0a84ff;background:rgba(10,132,255,.15)}
.shape-preview{width:100%;height:100%;background:linear-gradient(135deg,#5b9dff,#c84fff);transition:border-radius .3s}
.shape-preview.r-r{clip-path:none}
.shape-preview.r-c{border-radius:50%}
.shape-preview.r-s{border-radius:6px}

/* 添加按钮 / 工具栏 */
.add-widget-btn{position:absolute;bottom:132px;left:50%;transform:translateX(-50%) translateY(12px);padding:9px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.16);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s,transform .32s cubic-bezier(.34,1.4,.64,1)}
body.editing .add-widget-btn{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.edit-toolbar{position:absolute;bottom:180px;left:50%;transform:translateX(-50%) translateY(12px);display:flex;gap:10px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s,transform .32s cubic-bezier(.34,1.4,.64,1)}
body.editing .edit-toolbar{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.tool-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.16);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background .2s,transform .15s}
.tool-btn:hover{background:rgba(255,255,255,.26)}
.tool-btn:active{transform:scale(.9)}
.tool-btn .tool-label{position:absolute;bottom:-22px;font-size:9px;white-space:nowrap;opacity:.65;pointer-events:none}

/* Widget picker */
.widget-picker-panel{position:relative;width:100%;padding:20px 14px 34px;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.34,1.4,.64,1);color:#fff}
.widget-picker.shown .widget-picker-panel{transform:translateY(0)}
.widget-picker-title{font-size:14px;font-weight:600;text-align:center;margin-bottom:18px;position:relative;z-index:5}
.widget-picker-title span{opacity:.55;font-weight:400;font-size:11px;margin-left:6px}
.widget-picker-list{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none;position:relative;z-index:5}
.widget-picker-list::-webkit-scrollbar{display:none}
.widget-picker-item{flex-shrink:0;width:92px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;border:none;background:none;padding:0;color:#fff;font-family:inherit}
.widget-picker-preview{width:92px;height:92px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;border:1px solid rgba(255,255,255,.14)}
.wp-clock{background:linear-gradient(145deg,rgba(80,60,160,.75),rgba(40,30,90,.85))}
.wp-weather{background:linear-gradient(145deg,rgba(60,140,220,.7),rgba(30,60,140,.85))}
.wp-battery{background:linear-gradient(145deg,rgba(60,180,90,.65),rgba(20,80,50,.8))}
.wp-music{background:linear-gradient(145deg,rgba(220,60,120,.65),rgba(100,20,60,.8))}
.widget-picker-name{font-size:11px;opacity:.85}
.confirm-sheet-panel{position:relative;width:100%;padding:26px 22px 30px;border-radius:28px 28px 0 0;color:#fff;transform:translateY(100%);transition:transform .42s cubic-bezier(.34,1.4,.64,1);text-align:center}
.confirm-sheet.shown .confirm-sheet-panel{transform:translateY(0)}
.confirm-sheet-icon{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(145deg,rgba(80,60,160,.7),rgba(40,30,90,.85));position:relative;z-index:5}
.confirm-sheet-title{font-size:16px;font-weight:600;margin-bottom:8px;position:relative;z-index:5}
.confirm-sheet-desc{font-size:13px;opacity:.72;line-height:1.5;margin-bottom:22px;padding:0 6px;position:relative;z-index:5}
.confirm-sheet-actions{display:flex;gap:10px;position:relative;z-index:5}
.confirm-sheet-btn{flex:1;height:46px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.confirm-sheet-btn.cancel{background:rgba(255,255,255,.12);color:rgba(255,255,255,.9)}
.confirm-sheet-btn.confirm{background:#0a84ff;color:#fff}

/* ═══ 控制中心 ═══ */
.control-center,.notification-center{position:absolute;left:0;top:0;right:0;bottom:0;z-index:600;pointer-events:none;transform:translate3d(0,-100%,0);visibility:hidden;will-change:transform}
.control-center.visible,.notification-center.visible{pointer-events:auto;visibility:visible}
.cc-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.12);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.nc-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.12);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.control-center.blurred .cc-backdrop,.notification-center.blurred .nc-backdrop{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cc-panel{position:absolute;inset:0;padding:56px 14px 20px;display:flex;flex-direction:column;gap:12px}
.cc-row{display:flex;gap:12px}
.cc-connect{flex:1.05;border-radius:28px;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:158px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.08);
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.08);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.5),
    inset 0 -1px 0 0 rgba(255,255,255,.1),
    inset 0 0 0 1px rgba(255,255,255,.1),
    0 8px 32px -8px rgba(0,0,0,.4);
}
.cc-tile{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#fff;font-size:10px;cursor:pointer;
  transition:background .25s,transform .12s,box-shadow .3s;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.4),
    inset 0 0 0 1px rgba(255,255,255,.05);
  position:relative;z-index:5;
}
.cc-tile:active{transform:scale(.94)}
.cc-tile .tile-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cc-tile .tile-icon img{width:100%;height:100%;object-fit:contain}
.cc-tile .tile-fallback{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.5)}
.cc-tile.on{
  background:linear-gradient(135deg,#0a84ff,#0066dd);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  box-shadow:
    0 0 20px rgba(10,132,255,.75),
    0 0 44px rgba(10,132,255,.5),
    0 0 72px rgba(10,132,255,.28),
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 0 14px rgba(255,255,255,.24);
}
.cc-tile.on .tile-icon img{filter:brightness(0) invert(1)}
.cc-tile.on .tile-fallback{background:#fff}
.cc-media{
  flex:.95;border-radius:28px;padding:16px;height:158px;
  display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.08);
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.08);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.5),
    inset 0 -1px 0 0 rgba(255,255,255,.1),
    inset 0 0 0 1px rgba(255,255,255,.1),
    0 8px 32px -8px rgba(0,0,0,.4);
}
.cc-media-title{font-size:13px;font-weight:600;position:relative;z-index:5}
.cc-media-sub{font-size:10px;opacity:.6;margin-top:2px;position:relative;z-index:5}
.cc-media-controls{display:flex;align-items:center;justify-content:space-around;position:relative;z-index:5}
.cc-media-controls .btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.icon-prev,.icon-next{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent}
.icon-prev{border-right:10px solid #fff}
.icon-next{border-left:10px solid #fff}
.icon-play{width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid #fff;margin-left:2px}
.cc-row-sliders{display:flex;gap:12px;flex:1;height:190px}
.cc-slider{
  flex:1;border-radius:28px;position:relative;overflow:hidden;
  touch-action:none;cursor:pointer;padding:0;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.08);
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.08);
  box-shadow:
    inset 0 1px 0 0 rgba(255,255,255,.45),
    inset 0 -1px 0 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.1),
    0 8px 32px -8px rgba(0,0,0,.4);
}
.cc-slider-fill{
  position:absolute;left:3px;right:3px;bottom:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(230,235,255,.85) 100%);
  border-radius:0 0 25px 25px;
  pointer-events:none;transition:height .2s;z-index:5;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,1),
    0 -4px 12px rgba(255,255,255,.35),
    0 0 24px rgba(180,220,255,.3);
}
.cc-slider-fill::before{content:'';position:absolute;left:-6px;right:-6px;top:-6px;height:14px;background:radial-gradient(60% 100% at 50% 50%,rgba(255,255,255,.9) 0%,rgba(255,255,255,.35) 40%,rgba(255,255,255,0) 75%);filter:blur(3px);pointer-events:none}
.cc-slider-icon{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:6;width:28px;height:28px}
.cc-slider-icon img{width:100%;height:100%;object-fit:contain}
.cc-slider-icon .tile-fallback{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.6)}
.nc-panel{
  position:absolute;
  left:0 !important;top:0 !important;right:0 !important;bottom:0 !important;
  padding:60px 20px 20px;color:#fff;
  transform:none !important;
}
.nc-date{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1px}
.nc-week{font-size:16px;opacity:.75;margin-top:4px;margin-bottom:28px}
.nc-empty{text-align:center;opacity:.5;font-size:14px;margin-top:60px}

/* ★ 通知列表 */
.nc-list{
  display:flex;flex-direction:column;gap:8px;
  max-height:calc(100% - 200px);
  overflow-y:auto;scrollbar-width:none;
  padding-bottom:80px;   /* ★ 给底部按钮留位 */
}
.nc-list::-webkit-scrollbar{display:none}

.nc-item{
  position:relative;
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;
  border-radius:20px;
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(8px) saturate(180%);
  -webkit-backdrop-filter:blur(8px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 6px 20px -6px rgba(0,0,0,.3);
  animation:ncIn .4s cubic-bezier(.34,1.4,.64,1) backwards;
  transition:transform .15s,opacity .2s;
}
.nc-item.read{opacity:.55}
.nc-item:active{transform:scale(.98)}
@keyframes ncIn{
  from{opacity:0;transform:translateY(-8px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.nc-item-icon{
  width:38px;height:38px;border-radius:10px;
  flex-shrink:0;object-fit:cover;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
  pointer-events:none;
}
.nc-item-icon-fallback{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#5b9dff,#8a6bff);
  font-size:16px;color:#fff;
}
.nc-item-body{flex:1;min-width:0;pointer-events:none}
.nc-item-title{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.3}
.nc-item-text{font-size:12px;opacity:.78;line-height:1.4;word-break:break-word}
.nc-item-time{font-size:10px;opacity:.5;margin-top:4px}
.nc-item-close{
  position:absolute;top:8px;right:8px;
  width:22px;height:22px;border-radius:50%;
  border:none;background:rgba(255,255,255,.18);
  color:rgba(255,255,255,.85);font-size:11px;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding:0;
  opacity:.7;
  transition:opacity .2s,background .15s,transform .15s;
  z-index:99 !important;    /* ★ 强制最高，压在所有子元素上 */
}
/* ★ 超出上限提示 */
.nc-more{
  text-align:center;
  padding:12px 0 4px;
  font-size:12px;
  letter-spacing:.5px;
  color:rgba(255,255,255,.5);
  animation:ncIn .4s cubic-bezier(.34,1.4,.64,1) backwards;
  animation-delay:.15s;
}
.nc-item:hover .nc-item-close{opacity:1}
/* ★ 清空全部按钮 */
.nc-clear-all{
  position:absolute;
  left:50%;bottom:24px;
  transform:translateX(-50%);
  padding:10px 24px;
  border-radius:22px;
  border:none;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(8px) saturate(180%);
  -webkit-backdrop-filter:blur(8px) saturate(180%);
  color:rgba(255,255,255,.88);
  font-family:inherit;
  font-size:13px;font-weight:500;
  cursor:pointer;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 8px 24px -8px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  z-index:2;
  transition:transform .15s,background .2s;
}
.nc-clear-all:active{
  transform:translateX(-50%) scale(.94);
  background:rgba(255,255,255,.22);
}
.nc-item-close:active{
  background:rgba(255,255,255,.4);
  transform:scale(.9);
}

/* ═══ App 视图 / 窗口 / 切换器 ═══ */
.app-view{position:absolute;inset:0;z-index:500;background:#f2f2f7;opacity:0;pointer-events:none;overflow:hidden;will-change:transform,opacity;display:flex;flex-direction:column}
.app-view.active{pointer-events:auto}
.app-header{padding:58px 24px 28px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0}
.app-header-icon{width:82px;height:82px;border-radius:22px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;overflow:hidden}
.app-header-icon img{width:100%;height:100%;object-fit:contain}
.app-header-name{font-size:22px;font-weight:600}
.app-body{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:#f2f2f7;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.placeholder{text-align:center;color:#666;display:flex;flex-direction:column;align-items:center;gap:10px}
.placeholder h2{font-size:20px;color:#333}
.placeholder p{font-size:13px;opacity:.7}
.app-glass-tint{position:absolute;inset:0;z-index:520;pointer-events:none;opacity:0;background:linear-gradient(135deg,rgba(255,255,255,.42) 0%,rgba(235,240,255,.32) 35%,rgba(220,230,255,.28) 65%,rgba(255,255,255,.38) 100%);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.mini-window{position:absolute!important;width:190px;height:250px;left:50%;top:50%;margin-left:-95px;margin-top:-125px;border-radius:20px;z-index:650;display:flex;flex-direction:column;overflow:hidden;transform:translate3d(var(--mx,0px),var(--my,0px),0);will-change:transform}
.mini-window[hidden]{display:none!important}
.mini-header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.2);cursor:grab;touch-action:none;flex-shrink:0;position:relative;z-index:5}
.mini-icon{width:20px;height:20px;border-radius:5px}
.mini-title{flex:1;font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-close{width:20px;height:20px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:11px;cursor:pointer;padding:0}
.mini-body{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;cursor:pointer;text-align:center;line-height:1.5;position:relative;z-index:5}
.mini-resize{position:absolute;right:0;bottom:0;width:32px;height:32px;cursor:nwse-resize;touch-action:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;opacity:.55;z-index:6}
.mini-resize::after{content:'';width:12px;height:12px;border-right:2px solid #fff;border-bottom:2px solid #fff;border-radius:0 0 3px 0}
.app-switcher{position:absolute;inset:0;z-index:700;pointer-events:none;opacity:0;background:rgba(0,0,0,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.app-switcher.visible{pointer-events:auto}
.switcher-cards{position:absolute;inset:0}
.sw-card-wrap{position:absolute;width:200px;height:430px;top:50%;left:50%;margin-left:-100px;margin-top:-215px;will-change:transform,opacity}
.sw-card{width:100%;height:100%;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.5);cursor:grab;touch-action:none;position:relative}
.sw-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sw-mini-btn{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:13px;cursor:pointer;padding:0}
.spotlight{position:absolute;inset:0;z-index:750;pointer-events:none;opacity:0;transition:opacity .3s}
.spotlight.visible{pointer-events:auto}
.spotlight.shown{opacity:1}
.spotlight-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.1)}
.spotlight-panel{position:absolute;left:16px;right:16px;top:80px;max-height:500px;display:flex;flex-direction:column;gap:10px;transform:translateY(-30px) scale(.94);opacity:0;transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .25s}
.spotlight.shown .spotlight-panel{transform:translateY(0) scale(1);opacity:1}
.spotlight-search{
  display:flex;align-items:center;gap:10px;border-radius:18px;padding:12px 14px;color:#fff;
  background:rgba(255,255,255,.10) !important;
  backdrop-filter:blur(8px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(8px) saturate(180%) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 8px 24px -8px rgba(0,0,0,.35) !important;
  --lg-blur:0px !important;
}
.spotlight-search svg{position:relative;z-index:5}
.spotlight-search input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:15px;min-width:0;position:relative;z-index:5}
.spotlight-results{
  border-radius:22px;padding:12px;max-height:380px;overflow-y:auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;scrollbar-width:none;
  background:rgba(255,255,255,.10) !important;
  backdrop-filter:blur(8px) saturate(180%) !important;
  -webkit-backdrop-filter:blur(8px) saturate(180%) !important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(255,255,255,.08),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 12px 32px -8px rgba(0,0,0,.35) !important;
  --lg-blur:0px !important;
}
.spotlight-results::-webkit-scrollbar{display:none}
.spotlight-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:10px;cursor:pointer;position:relative;z-index:5}
.spotlight-icon{
  width:40px;height:40px;border-radius:11px;
  overflow:hidden;
  display:block;
  flex-shrink:0;
}
.spotlight-icon img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  transform:scale(2.85);
  transform-origin:center;
}
.spotlight-item[data-id="天气"] .spotlight-icon img,
.spotlight-item[data-id="日历"] .spotlight-icon img{

  transform:none;
}
.spotlight-item span{font-size:10px;color:#fff;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.spotlight-empty{grid-column:1/-1;text-align:center;color:rgba(255,255,255,.6);padding:30px 0;font-size:13px}

/* ═══ 其他 UI ═══ */
.volume-hud{position:absolute;left:24px;top:50%;width:16px;height:220px;transform:translateY(-50%) translateX(-24px);background:rgba(0,0,0,.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:14px;z-index:850;opacity:0;pointer-events:none;transition:opacity .28s,transform .4s cubic-bezier(.34,1.4,.64,1);overflow:hidden;padding:3px;box-shadow:0 10px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}

/* 屏幕边缘流动彩虹 */
/* 屏幕边缘 · 诗意彩虹 */
.ai-rainbow-edge{
  position:absolute;inset:0;z-index:2000;
  border-radius:44px;
  pointer-events:none;
  overflow:hidden;
  opacity:0;
  transition:opacity .55s var(--ease-out);
}
.ai-rainbow-edge.show{opacity:1;}

/* 底层：静态淡彩虹氛围 · 缓慢色相漂移 */
.ai-rainbow-edge::after{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  padding:1.5px;
  background:linear-gradient(120deg,
    rgba(255,79,163,.28) 0%,
    rgba(200,79,255,.28) 20%,
    rgba(91,157,255,.32) 40%,
    rgba(140,220,255,.35) 50%,
    rgba(91,157,255,.32) 60%,
    rgba(200,79,255,.28) 80%,
    rgba(255,79,163,.28) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:blur(.6px) saturate(1.2);
  mix-blend-mode:screen;
  animation:aiRainbowHue 12s linear infinite;
  pointer-events:none;
}

/* 顶层：一道柔光带 · 从右往左滑过边缘 */
.ai-rainbow-edge::before{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  padding:2.5px;
  background:linear-gradient(105deg,
    transparent 28%,
    rgba(255,140,210,.4) 36%,
    rgba(200,140,255,.85) 42%,
    rgba(140,190,255,1) 47%,
    rgba(220,250,255,1) 50%,
    rgba(140,190,255,1) 53%,
    rgba(200,140,255,.85) 58%,
    rgba(255,140,210,.4) 64%,
    transparent 72%);
  background-size:280% 100%;
  background-position:220% 50%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:blur(1.4px) saturate(1.5) brightness(1.3);
  mix-blend-mode:screen;
  pointer-events:none;
  animation:aiRainbowFlow 4.5s cubic-bezier(.4,0,.55,1) infinite;
}

@keyframes aiRainbowFlow{
  0%   {background-position:220% 50%; opacity:0;}
  6%   {opacity:1;}
  55%  {background-position:-140% 50%; opacity:1;}
  66%  {opacity:0;}
  100% {background-position:-140% 50%; opacity:0;}
}

@keyframes aiRainbowHue{
  from{filter:blur(.6px) saturate(1.2) hue-rotate(0deg);}
  to{filter:blur(.6px) saturate(1.2) hue-rotate(360deg);}
}

.ai-orb-flower{

}
/* ★ 每片花瓣：位置由 --i 决定，独立呼吸 */
.ai-orb-flower .petal{
  position:absolute;
  left:50%;
  top:50%;
  width:11px;      /* ★ 16 → 11 */
  height:19px;     /* ★ 26 → 19 */
  margin-left:-5.5px;

  border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
  background:
    radial-gradient(ellipse at 50% 85%,
      rgba(255,255,255,.95) 0%,
      rgba(180,220,255,.65) 35%,
      rgba(140,160,255,.3) 68%,
      rgba(120,140,255,0) 100%);
  box-shadow:
    inset 0 0 3px rgba(255,255,255,.85),
    inset 0 -2px 4px rgba(120,180,255,.5);
  transform-origin:50% 100%;
  transform:rotate(calc(var(--i) * 45deg));
  animation:petalBreathe 3.2s ease-in-out infinite;
  animation-delay:calc(var(--i) * -0.4s);
}

.ai-orb-flower .flower-core{
  position:absolute;

  width:12px;height:12px;
  margin-left:-6px;margin-top:-6px;

  animation:corePulse 2.4s ease-in-out infinite;
}

  0%,100%{filter:brightness(1) saturate(1);}
  50%{filter:brightness(1.4) saturate(1.2);}
}
@keyframes corePulse{
  0%,100%{opacity:1;filter:brightness(1);}
  50%{opacity:.75;filter:brightness(1.5);}
}

/* ═══ LG 液态玻璃（简化版） ═══ */
const LG=(function(){
  const registered=new Set();let raf=0;const EASE=.18;
  function register(el){
    if(!el||registered.has(el))return;
    if(el.id==='dynamicIsland'||el.id==='dock')return;
    if(el.offsetWidth===0||el.offsetHeight===0){if(el._lgRetry)return;el._lgRetry=setTimeout(()=>{el._lgRetry=null;register(el);},500);return;}
    registered.add(el);
    el._lg={tx:30,ty:28,cx:30,cy:28,active:false};
    el.addEventListener('pointermove',e=>{
      const r=el.getBoundingClientRect();const s=el._lg;if(!s)return;
      s.tx=((e.clientX-r.left)/r.width)*100;
      s.ty=((e.clientY-r.top)/r.height)*100;
      if(!s.active){s.active=true;el.classList.add('lg-active');}
      kick();
    },{passive:true});
    el.addEventListener('pointerleave',()=>{
      const s=el._lg;if(!s)return;
      s.tx=30;s.ty=28;s.active=false;
      el.classList.remove('lg-active');kick();
    });
  }
  function kick(){if(!raf)raf=requestAnimationFrame(tick);}
  function tick(){
    raf=0;let more=false;
    registered.forEach(el=>{
      if(!el.isConnected){registered.delete(el);return;}
      const s=el._lg;if(!s)return;
      const dx=s.tx-s.cx,dy=s.ty-s.cy;
      if(Math.abs(dx)<.05&&Math.abs(dy)<.05)return;
      s.cx+=dx*EASE;s.cy+=dy*EASE;
      el.style.setProperty('--lg-x',s.cx.toFixed(2)+'%');
      el.style.setProperty('--lg-y',s.cy.toFixed(2)+'%');
      more=true;
    });
    if(more)raf=requestAnimationFrame(tick);
  }
  function scan(){document.querySelectorAll('.lg').forEach(register);}
  function init(){
    scan();
    new MutationObserver(()=>scan()).observe(document.body,{childList:true,subtree:true});
    window._lgScan=scan;
  }
  return{init,scan,register};
})();

  function init(){
    screen_.appendChild(canvas);

    resize();

    document.addEventListener('visibilitychange',()=>{

      const r=screen_.getBoundingClientRect();
      const now=performance.now();
      const nx=e.clientX-r.left,ny=e.clientY-r.top;
      const dt=now-pointer.lastT;
      if(dt>0&&dt<100){
        pointer.vx=(nx-pointer.x)/dt*16;
        pointer.vy=(ny-pointer.y)/dt*16;
      }
      pointer.x=nx;pointer.y=ny;pointer.active=true;pointer.lastT=now;
    },{passive:true});
    screen_.addEventListener('pointerleave',()=>{pointer.active=false;});
    screen_.addEventListener('pointerdown',e=>{
      const r=screen_.getBoundingClientRect();
      const x=e.clientX-r.left,y=e.clientY-r.top;

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,IS_LOW_END?1.5:2);
    W=screen_.clientWidth||340;H=screen_.clientHeight||720;
    canvas.width=Math.max(1,Math.round(W*dpr));canvas.height=Math.max(1,Math.round(H*dpr));
    canvas.style.width=W+'px';canvas.style.height=H+'px';

  function spawn(p){
    let pt;

    pt.gravity=-.008;pt.friction=.993;
    pt.trail=0;pt.trailHist=null;
    pt.magnet=0;pt.magnetRadius=70;
    pt.bounce=0;pt.colliders=null;
    pt.twinklePhase=Math.random()*6.28;

  function kill(i){

  function loop(ts){
    if(!running)return;
    const dtMs=Math.min(48,ts-last);last=ts;
    // 性能自适应：帧率 < 40fps 时降级
    perfFrames++;perfAccum+=dtMs;
    if(perfFrames>=30){
      const fps=1000/(perfAccum/perfFrames);
      if(fps<40&&perfScale>.35)perfScale=Math.max(.35,perfScale-.08);
      else if(fps>55&&perfScale<1)perfScale=Math.min(1,perfScale+.03);
      perfFrames=0;perfAccum=0;
    }
    const dt=dtMs/16.667;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';

    // 拖尾预渲染：先画所有拖尾
    for(let i=0;i<parts.length;i++){
      const p=parts[i];
      if(p.trail>0&&p.trailHist&&p.trailHist.length>=4){
        ctx.beginPath();
        const th=p.trailHist;
        const len=th.length;
        ctx.moveTo(th[0],th[1]);
        for(let j=2;j<len;j+=2)ctx.lineTo(th[j],th[j+1]);

      }
    }

    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.life-=p.decay*dt;
      if(p.life<=0){kill(i);continue;}
      p.vy+=p.gravity*dt;

      // 磁吸/拨动
      if(pointer.active&&p.magnet!==0){
        const dx=p.x-pointer.x,dy=p.y-pointer.y;
        const d2=dx*dx+dy*dy;
        const R=p.magnetRadius;
        if(d2<R*R&&d2>4){
          const d=Math.sqrt(d2);
          const f=(1-d/R)*p.magnet;
          p.vx+=(dx/d)*f*dt;
          p.vy+=(dy/d)*f*dt;
        }
      }
      // 碰撞体：反向弹开
      if(p.colliders&&p.bounce>0){
        for(let ci=0;ci<p.colliders.length;ci++){
          const c=p.colliders[ci];
          if(p.x>c.x&&p.x<c.x+c.w&&p.y>c.y&&p.y<c.y+c.h){

            const d=Math.hypot(nx2,ny2)||1;
            p.vx+=(nx2/d)*p.bounce;
            p.vy+=(ny2/d)*p.bounce;
            // 推出
            p.x=cx+(nx2/d)*(Math.max(c.w,c.h)/2+2);
            p.y=cy+(ny2/d)*(Math.max(c.w,c.h)/2+2);
            break;
          }
        }
      }

      const drag=Math.pow(p.friction,dt);
      p.vx*=drag;p.vy*=drag;
      p.x+=p.vx*dt;p.y+=p.vy*dt;

      if(p.bounds){const b=p.bounds;if(p.x<b.x||p.x>b.x+b.w||p.y<b.y||p.y>b.y+b.h){kill(i);continue;}}

      // 拖尾记录
      if(p.trail>0){
        if(!p.trailHist)p.trailHist=[];
        p.trailHist.push(p.x,p.y);
        if(p.trailHist.length>p.trail*2)p.trailHist.splice(0,p.trailHist.length-p.trail*2);
      }

      const age=1-p.life;
      const gp=Math.min(1,age/.25),ep=Math.min(1,p.life/.4);
      const tw=.6+.4*Math.sin(age*20+p.twinklePhase);
      const sz=p.size*gp*ep*(.85+.3*tw);
      if(sz<.12)continue;
      const a=p.alpha*Math.min(1,age*7)*Math.min(1,p.life*1.4)*tw;
      if(a<.008)continue;

      const half=sz*4;
      if(p.hue2!=null){
        /* ★ 渐变色粒子 · 加强核心 + 外发光 */
        const h1=((p.hue%360)+360)%360;
        const h2=((p.hue2%360)+360)%360;
        const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,half);
        grad.addColorStop(0,   'hsla('+h1+',100%,100%,1)');
        grad.addColorStop(0.10,'hsla('+h1+',100%,95%,1)');     /* ★ 更实的核心 */
        grad.addColorStop(0.30,'hsla('+h1+',100%,85%,0.65)');
        grad.addColorStop(0.60,'hsla('+h2+',100%,72%,0.28)');
        grad.addColorStop(0.85,'hsla('+h2+',100%,60%,0.08)');
        grad.addColorStop(1,   'hsla('+h2+',100%,55%,0)');
        ctx.fillStyle=grad;
        ctx.globalAlpha=a;
        /* ★ 主体 */
        ctx.beginPath();
        ctx.arc(p.x,p.y,half,0,Math.PI*2);
        ctx.fill();
        /* ★ 白色核心（让粒子"发光"） */
        ctx.fillStyle='hsla('+h1+',100%,100%,'+(a*0.55)+')';
        ctx.beginPath();
        ctx.arc(p.x,p.y,half*0.22,0,Math.PI*2);
        ctx.fill();
      }else{
        const sprite=getSprite(p.hue);
        ctx.globalAlpha=a;
        ctx.drawImage(sprite.canvas,(p.x-half)|0,(p.y-half)|0,(half*2)|0,(half*2)|0);
      }
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    if(parts.length===0){stop();return;}
    raf=requestAnimationFrame(loop);
  }

/* ═══ BG_EFFECT ═══ */
const BG_EFFECT=(function(){
  let raf=0,pending=null,active=false;
  function apply(v){
    wallpaper_.style.filter='blur('+v.blur.toFixed(2)+'px) brightness('+v.bright.toFixed(3)+') saturate('+v.sat.toFixed(3)+')';
    wallpaper_.style.transform='scale('+v.scale.toFixed(4)+')';
    ambientGlow.style.opacity=v.glow.toFixed(3);
  }
  function schedule(v){pending=v;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const p=pending;pending=null;if(p)apply(p);});}
  function begin(){if(active)return;active=true;wallpaper_.classList.add('bg-anim');ambientGlow.style.transition='none';}
  function set(p){p=Math.min(1,Math.max(0,p));const maxBlur=IS_LOW_END?6:9;schedule({blur:p*maxBlur,bright:1-p*.16,sat:1-p*.22,scale:1+p*.05,glow:.45+p*.55});}
  function end(){if(!active)return;active=false;if(raf){cancelAnimationFrame(raf);raf=0;pending=null;}wallpaper_.classList.remove('bg-anim');void wallpaper_.offsetWidth;wallpaper_.style.filter='';wallpaper_.style.transform='';ambientGlow.style.transition='';ambientGlow.style.opacity='';}
  return{begin,set,end};
})();

const nodeMap=new Map();
function getItemSpan(item){
  if(item&&item.isFolder&&item.isLarge)return{w:2,h:2};

  if(item.size){
    const m=item.size.split('x');return{w:+m[0],h:+m[1]};

function newGrid(){return Array.from({length:GRID.rows},()=>new Array(GRID.cols).fill(false));}
function findSlot(grid,w,h){for(let r=0;r<=GRID.rows-h;r++){for(let c=0;c<=GRID.cols-w;c++){let ok=true;for(let dr=0;dr<h&&ok;dr++){for(let dc=0;dc<w&&ok;dc++){if(grid[r+dr][c+dc])ok=false;}}if(ok)return{row:r,col:c};}}return null;}
function markGrid(grid,r,c,w,h){for(let dr=0;dr<h;dr++){for(let dc=0;dc<w;dc++)grid[r+dr][c+dc]=true;}}

function reflowFrom(){
  const all=[];STATE.pages.forEach(p=>p.forEach(it=>all.push(it)));
  const newPages=[];let cur=[],grid=newGrid();
  for(const item of all){
    const span=getItemSpan(item);
    let pos=findSlot(grid,span.w,span.h);
    if(!pos){if(cur.length)newPages.push(cur);cur=[];grid=newGrid();pos=findSlot(grid,span.w,span.h);if(!pos)continue;}
    markGrid(grid,pos.row,pos.col,span.w,span.h);
    cur.push(item);
  }
  if(cur.length)newPages.push(cur);
  if(!newPages.length)newPages.push([]);
  STATE.pages=newPages;
  if(STATE.page>=STATE.pages.length)STATE.page=STATE.pages.length-1;
  renderAllPages();
}
function syncPageDom(pi){

  let pageEl=appPages.children[pi];
  if(!pageEl){pageEl=document.createElement('div');pageEl.className='app-page';pageEl.dataset.page=pi;appPages.appendChild(pageEl);}
  const want=new Set();items.forEach(it=>it&&it.id&&want.add(it.id));

function addNewPage(){STATE.pages.push([]);const pageEl=document.createElement('div');pageEl.className='app-page';pageEl.dataset.page=STATE.pages.length-1;appPages.appendChild(pageEl);updateDots();}
function _updateDrag(el,session,e){
  const ds=session.dragState;if(!ds)return;

  const dist=Math.hypot(dx,dy);
  if(!ds.realDragStarted){if(dist<ICON_CONST.REAL_DRAG_THRESHOLD)return;ds.realDragStarted=true;ds.realDragStartDx=dx;ds.realDragStartDy=dy;}
  let followDx=dx-ds.realDragStartDx,followDy=dy-ds.realDragStartDy;
  const scaleVal=ds.isWidget?1.02:1.15;
  ds.ghost.style.transform='translate3d('+followDx+'px, '+followDy+'px, 0) scale('+scaleVal+')';
  const sr=screen_.getBoundingClientRect();
  auraMove(e.clientX-sr.left,e.clientY-sr.top);
  BackdropTexture.markDirty();
  { const gr=ds.ghost.getBoundingClientRect(); FolderWave.setAttract(gr.left+gr.width/2, gr.top+gr.height/2); }
  if(!ds._fxT||performance.now()-ds._fxT>28){
    ds._fxT=performance.now();
    FX.trail(e.clientX-sr.left,e.clientY-sr.top,{hue:ds.isWidget?265:205,hueSpread:45,count:2,size:3.2,life:.95,jitter:12,spread:.7,rise:.15});
  }

          ds.dropTimer=null;

    const gcx=ds.baseCx+followDx,gcy=ds.baseCy+followDy;

    }
  }
  // 实时让位
  if(!ds.isWidget&&!ds.isFromDock){
    const pageEl=appPages.querySelector('.app-page[data-page="'+STATE.page+'"]');
    if(pageEl){
      const targetIdx=computeTargetIndex(el,ds.ghost,pageEl);
      if(targetIdx!==ds.lastTargetIndex){

          _applyLiveReflow(el,ds,pageEl,targetIdx);
        }else{
          if(!ds.reflowTimer){
            ds.reflowTimer=setTimeout(()=>{
              ds.reflowTimer=null;
              if(!ds.ghost||!ds.ghost.isConnected)return;
              const pe=appPages.querySelector('.app-page[data-page="'+STATE.page+'"]');
              if(!pe)return;
              const finalIdx=computeTargetIndex(el,ds.ghost,pe);
              ds.lastTargetIndex=finalIdx;ds.lastReflowTime=performance.now();

}
function _applyLiveReflow(draggedEl,ds,pageEl,targetIndex){
  const page=STATE.pages[STATE.page];if(!page)return;
  const origIdx=ds.origIndex;const draggedItem=page[origIdx];if(!draggedItem)return;
  const tempOrder=page.filter((_,i)=>i!==origIdx);
  tempOrder.splice(targetIndex,0,draggedItem);
  const records=[];
  pageEl.querySelectorAll('.app-icon, .app-widget').forEach(node=>{
    if(node===draggedEl)return;
    node.style.transition='none';node.style.translate='';
    records.push({node,rect:node.getBoundingClientRect()});
  });
  const grid=newGrid();
  tempOrder.forEach(item=>{
    const span=getItemSpan(item);
    const pos=findSlot(grid,span.w,span.h);if(!pos)return;
    markGrid(grid,pos.row,pos.col,span.w,span.h);
    if(item===draggedItem)return;
    const node=nodeMap.get(item.id);
    if(!node||node===draggedEl)return;
    node.style.gridColumn=(pos.col+1)+' / span '+span.w;
    node.style.gridRow=(pos.row+1)+' / span '+span.h;
  });
  void pageEl.offsetWidth;
  records.forEach(({node,rect})=>{
    const newRect=node.getBoundingClientRect();
    const dx=rect.left-newRect.left,dy=rect.top-newRect.top;
    if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;
    node.style.transition='none';node.style.willChange='translate';
    node.style.translate=dx+'px '+dy+'px';
    void node.offsetWidth;
    requestAnimationFrame(()=>{
      node.style.transition='translate .38s cubic-bezier(.22,1.15,.36,1)';
      node.style.translate='0 0';
      setTimeout(()=>{node.style.transition='';node.style.translate='';node.style.willChange='';},420);
    });
  });
}
function computeTargetIndex(el,ghost,pageEl){
  const candidates=[...pageEl.querySelectorAll('.app-icon, .app-widget')].filter(ic=>ic!==el);
  if(candidates.length===0)return 0;
  const gr=ghost.getBoundingClientRect();
  const gCx=gr.left+gr.width/2,gCy=gr.top+gr.height/2;
  const infos=candidates.map((ic,idx)=>{const r=ic.getBoundingClientRect();return{el:ic,idx,cx:r.left+r.width/2,cy:r.top+r.height/2};});
  const sorted=[...infos].sort((a,b)=>a.cy-b.cy);
  const rows=[];let cur=[sorted[0]];
  for(let i=1;i<sorted.length;i++){
    if(Math.abs(sorted[i].cy-cur[0].cy)<30)cur.push(sorted[i]);
    else{rows.push(cur);cur=[sorted[i]];}
  }
  rows.push(cur);
  let nearestRow=rows[0],minRowDist=Infinity;
  rows.forEach(row=>{
    const rowY=row.reduce((s,it)=>s+it.cy,0)/row.length;
    const d=Math.abs(gCy-rowY);
    if(d<minRowDist){minRowDist=d;nearestRow=row;}
  });
  nearestRow.sort((a,b)=>a.cx-b.cx);
  const HYST=24;
  for(let i=0;i<nearestRow.length;i++){if(gCx<nearestRow[i].cx-HYST)return nearestRow[i].idx;}
  return nearestRow[nearestRow.length-1].idx+1;
}
function _finishDrag(el,session){

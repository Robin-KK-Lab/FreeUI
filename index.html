    if(ds.reflowTimer){clearTimeout(ds.reflowTimer);ds.reflowTimer=null;}
    auraEnd();
    dock.classList.remove('dock-hover','dock-self','dock-full');
    if(!ds.realDragStarted){
      ds.ghost.style.transition='opacity .2s ease, transform .22s cubic-bezier(.34,1.4,.64,1)';
      ds.ghost.style.opacity='0';
      setTimeout(()=>ds.ghost.remove(),220);
      return;
    }
    const sr=screen_.getBoundingClientRect();
    const gr=ds.ghost.getBoundingClientRect();
    const gCx=gr.left+gr.width/2,gCy=gr.top+gr.height/2;
    const overDock=isOverDock(gCx,gCy);

    // 从 Dock 拖出
    if(ds.isFromDock){
      if(!overDock){
        const idx=DOCK_APPS.indexOf(ds.origId);
        if(idx>=0)DOCK_APPS.splice(idx,1);
        STATE.pages[STATE.page].push({id:ds.origId,name:ds.origName});
        renderDock();reflowFrom();markLibraryDirty();
        const p=screenPoint(gCx,gCy);
        FX.burst(p.x,p.y,{count:18,hue:205,hueSpread:50,speed:1.8,size:3.6,life:1.0,gravity:-.02,spread:Math.PI*2});
        islandText(ds.origName+' 已移到桌面');
      }else renderDock();
      ds.ghost.style.transition='opacity .2s ease, transform .3s var(--ease-spring)';
      ds.ghost.style.opacity='0';ds.ghost.style.transform+=' scale(.7)';
      setTimeout(()=>ds.ghost.remove(),320);
      return;
    }

    /* ★ 松手时如果还没锁定 dropTarget，但视觉上靠近文件夹，则现场判定 */
    let dropTarget=ds.dropTargetEl;
    if(!ds.isWidget && !dropTarget){
      const found=findDropTarget(el,ds.ghost,ds.candCache);
      if(found && found.el && found.el._item && found.el._item.isFolder){
        dropTarget=found.el;
      }
    }
    if(ds.candidateEl)ds.candidateEl.classList.remove('drop-target');
    ds.candidateEl=null;ds.dropTargetEl=null;

    // 拖入 Dock
    if(overDock){
      if(DOCK_APPS.includes(ds.origId)){
        ds.ghost.style.transition='opacity .18s';ds.ghost.style.opacity='0';
        setTimeout(()=>ds.ghost.remove(),200);return;
      }
      if(DOCK_APPS.length>=DOCK_MAX){
        islandText('Dock 栏已满');
        ds.ghost.style.transition='opacity .18s';ds.ghost.style.opacity='0';
        setTimeout(()=>ds.ghost.remove(),200);return;
      }
      DOCK_APPS.push(ds.origId);
      if(ds.origPi>=0&&ds.origPi<STATE.totalPages)STATE.pages[ds.origPi].splice(ds.origIndex,1);
      renderDock();reflowFrom();markLibraryDirty();
      islandText(ds.origName+' 已加入 Dock');
      const p=screenPoint(gCx,gCy);
      FX.ripple(p.x,p.y,{count:20,hue:205,speed:1.8,size:3.4});
      FX.burst(p.x,p.y,{count:20,hue:205,hueSpread:55,speed:2.0,size:3.8,life:1.1,gravity:-.02,spread:Math.PI*2});
      ds.ghost.style.transition='opacity .2s';ds.ghost.style.opacity='0';
      setTimeout(()=>ds.ghost.remove(),200);return;
    }

    // 合并到文件夹
    if(!ds.isWidget&&dropTarget&&dropTarget.isConnected){
      const target={el:dropTarget,index:parseInt(dropTarget.dataset.ix,10),pi:parseInt(dropTarget.dataset.pi,10)};
      if(!(target.pi===ds.origPi&&target.index===ds.origIndex)){
        const targetRect=dropTarget.getBoundingClientRect();
        FX.ripple(targetRect.left-sr.left+targetRect.width/2,targetRect.top-sr.top+targetRect.height/2,{count:26,hue:200,speed:2.4,size:3.6});
        FX.burst(targetRect.left-sr.left+targetRect.width/2,targetRect.top-sr.top+targetRect.height/2,{count:22,hue:195,hueSpread:60,speed:2.2,size:4,life:1.2,gravity:-.02});
        mergeIntoFolder(el,ds,target);
        ds.ghost.style.transition='opacity .18s ease, transform .18s ease';
        ds.ghost.style.opacity='0';ds.ghost.style.transform+=' scale(.7)';
        setTimeout(()=>ds.ghost.remove(),200);return;
      }
    }

    // 普通重排
    const targetPi=Math.max(0,Math.min(STATE.totalPages-1,STATE.page));
    const origPi=ds.origPi,origIndex=ds.origIndex;
    let targetIndex=ds.lastTargetIndex>=0?ds.lastTargetIndex:STATE.pages[targetPi].length;

    if(origPi>=0&&origPi<STATE.totalPages)STATE.pages[origPi].splice(origIndex,1);
    const draggedItem=ds.origEl._item||{id:el.dataset.id,name:el.dataset.id};
    // 调整 targetIndex（若同页且原位置在前）
    if(origPi===targetPi&&origIndex<targetIndex)targetIndex=Math.max(0,targetIndex-1);
    STATE.pages[targetPi].splice(targetIndex,0,draggedItem);
    reflowFrom();markLibraryDirty();
    ds.ghost.style.transition='opacity .18s ease, transform .18s ease';
    ds.ghost.style.opacity='0';ds.ghost.style.transform+=' scale(.7)';
    setTimeout(()=>ds.ghost.remove(),200);
  }finally{
    el.style.opacity='';el.style.pointerEvents='';el.classList.remove('dragging');
    const _pgEl=appPages.querySelector('.app-page[data-page="'+STATE.page+'"]');
    if(_pgEl){_pgEl.querySelectorAll('.app-icon, .app-widget').forEach(n=>{n.style.transition='';n.style.transform='';n.style.translate='';n.style.willChange='';});}
    if(ds.candCache){ds.candCache.list=null;ds.candCache.pi=-1;}
    if(STATE.editing)appPages.querySelectorAll('.app-icon, .app-widget').forEach(ic=>ic.classList.add('editing'));
    session.dragState=null;
  }
}

function exitEditMode(){if(!STATE.editing)return;STATE.editing=false;document.body.classList.remove('editing');appPages.querySelectorAll('.app-icon, .app-widget').forEach(el=>el.classList.remove('editing'));_lastTapEl=null;_lastTapTime=0;}

function isOverDock(x,y){const r=dock.getBoundingClientRect();return x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6;}
function renderDock(){dock.innerHTML='';DOCK_APPS.forEach((id,i)=>{const el=createIconEl({id,name:id},-1,i);el.dataset.pi=-1;el.dataset.ix=i;dock.appendChild(el);});}

/* ═══════════════════════════════════════════════════════════════
   FolderWave · 大文件夹液滴吸附
   ═══════════════════════════════════════════════════════════════ */
const FolderWave=(function(){
  const registered=new Set();
  let raf=0,active=false,stopTimer=0;
  let attractSX=-9999,attractSY=-9999;

  /* 影响半径：文件夹宽度的 1.1 倍，让"贴近感"和"触发感"一致 */
  const RADIUS_SCALE = 1.1;
  const maxDepth = 18;
  const falloff = 1.4;
  const attack = 0.35;
  const release = 0.16;

  /* ─── Catmull-Rom 平滑曲线 ─── */
  function smoothPath(points){
    const n = points.length;
    if(n < 3) return '';
    let d = 'M ' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2);
    for(let i = 0; i < n; i++){
      const p0 = points[(i - 1 + n) % n];
      const p1 = points[i];
      const p2 = points[(i + 1) % n];
      const p3 = points[(i + 2) % n];
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C ' + c1x.toFixed(2) + ' ' + c1y.toFixed(2) +
           ' ' + c2x.toFixed(2) + ' ' + c2y.toFixed(2) +
           ' ' + p2.x.toFixed(2) + ' ' + p2.y.toFixed(2);
    }
    d += ' Z';
    return d;
  }

  /* ─── 采样 0-100 坐标下的圆角矩形 ─── */
  function buildSamples(){
    const r = 20, sN = 28, cN = 5;
    const pts = [];
    const topLen = 100 - 2 * r;
    /* ★ 每段循环都不含终点，靠下一段起点补齐，避免重复点破坏 Catmull-Rom */
    for(let i = 0; i < sN; i++) pts.push({x: r + topLen * i / sN, y: 0});
    for(let i = 0; i < cN; i++){const a = -Math.PI/2 + (i/cN) * (Math.PI/2); pts.push({x: 100 - r + Math.cos(a) * r, y: r + Math.sin(a) * r});}
    const rightLen = 100 - 2 * r;
    for(let i = 0; i < sN; i++) pts.push({x: 100, y: r + rightLen * i / sN});
    for(let i = 0; i < cN; i++){const a = (i/cN) * (Math.PI/2); pts.push({x: 100 - r + Math.cos(a) * r, y: 100 - r + Math.sin(a) * r});}
    for(let i = 0; i < sN; i++) pts.push({x: 100 - r - topLen * i / sN, y: 100});
    for(let i = 0; i < cN; i++){const a = Math.PI/2 + (i/cN) * (Math.PI/2); pts.push({x: r + Math.cos(a) * r, y: 100 - r + Math.sin(a) * r});}
    for(let i = 0; i < sN; i++) pts.push({x: 0, y: 100 - r - rightLen * i / sN});
    for(let i = 0; i < cN; i++){const a = Math.PI + (i/cN) * (Math.PI/2); pts.push({x: r + Math.cos(a) * r, y: r + Math.sin(a) * r});}
    return pts;
  }
  const SAMPLES = buildSamples();
  const CX = 50, CY = 50;

  function updateFolder(folder){
    const rect = folder.getBoundingClientRect();
    if(rect.width < 5) return;
    const svg = folder.querySelector('.folder-wave');
    if(!svg) return;
    const shapeEl = svg.querySelector('.folder-shape');
    if(!shapeEl) return;

    const lx = (attractSX - rect.left) / rect.width * 100;
    const ly = (attractSY - rect.top) / rect.height * 100;

    const cxs = rect.left + rect.width / 2;
    const cys = rect.top + rect.height / 2;
    const distS = Math.hypot(attractSX - cxs, attractSY - cys);

    /* ★ 激活半径 = 合并判定半径（两者完全一致） */
    const radiusScreen = RADIUS_SCALE * rect.width;
    const activated = distS < radiusScreen;
    const radiusLocal = RADIUS_SCALE * 100;

    if(!folder._waveOffset || folder._waveOffset.length !== SAMPLES.length){
      folder._waveOffset = SAMPLES.map(() => ({x:0, y:0}));
    }
    const offsets = folder._waveOffset;
    const lerp = activated ? attack : release;

    for(let i = 0; i < SAMPLES.length; i++){
      const p = SAMPLES[i];
      let tx = 0, ty = 0;
      if(activated){
        const dx = lx - p.x, dy = ly - p.y;
        const d = Math.hypot(dx, dy);
        if(d < radiusLocal && d > 0.01){
          const t = d / radiusLocal;
          const g = Math.exp(-(t * t) * falloff);
          const dirX = dx / d, dirY = dy / d;
          const ncx = p.x - CX, ncy = p.y - CY;
          const nl = Math.hypot(ncx, ncy) || 1;
          const outward = dirX * (ncx / nl) + dirY * (ncy / nl);
          if(outward > 0.05){
            const off = g * maxDepth * outward;
            tx = dirX * off; ty = dirY * off;
          }
        }
      }
      const o = offsets[i];
      o.x += (tx - o.x) * lerp;
      o.y += (ty - o.y) * lerp;
    }

    const finalPts = SAMPLES.map((p, i) => ({
      x: p.x + offsets[i].x,
      y: p.y + offsets[i].y
    }));
    shapeEl.setAttribute('d', smoothPath(finalPts));
  }

  function loop(){
    raf = 0;
    registered.forEach(f => {
      if(!f.isConnected){registered.delete(f); return;}
      updateFolder(f);
    });
    if(active) raf = requestAnimationFrame(loop);
  }

  function start(){
    if(active) return;
    active = true;
    clearTimeout(stopTimer);
    if(!raf) raf = requestAnimationFrame(loop);
  }

  function stop(){
    attractSX = -9999; attractSY = -9999;
    clearTimeout(stopTimer);
    stopTimer = setTimeout(() => {
      active = false;
      if(raf){cancelAnimationFrame(raf); raf = 0;}
    }, 500);
  }

  function setAttract(x, y){ attractSX = x; attractSY = y; }

  function register(folderEl){
    if(!folderEl || registered.has(folderEl)) return;
    const imgWrap = folderEl.querySelector('.icon-img');
    if(!imgWrap) return;
    if(!imgWrap.querySelector('.folder-wave')){
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'folder-wave');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      const shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      shape.setAttribute('class', 'folder-shape');
      shape.setAttribute('d', smoothPath(SAMPLES));
      svg.appendChild(shape);
      imgWrap.insertBefore(svg, imgWrap.firstChild);
    }
    registered.add(folderEl);
  }

  return {register, start, stop, setAttract};
})();

/* ═══════════════════════════════════════════════════════════════
   BackdropTexture v2 · 只采样玻璃周围一圈
   ═══════════════════════════════════════════════════════════════ */
const BackdropTexture=(function(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const imgCache=new Map();
  let wallpaperImg=null;
  let wallpaperGradColors=null;
  let initialized=false;
  let blurPx=0;
  let dirty=true;                  /* ★ 脏标记：需要重绘 */

  function getImg(src){
    if(imgCache.has(src))return imgCache.get(src);
    const img=new Image();
    img.src=src;
    imgCache.set(src,img);
    return img;
  }
  function roundRect(c,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }
  function setWallpaper(bg){
    if(!bg)return;
    const urlMatch=bg.match(/url\(['"]([^'"]+)['"]\)/);
    if(urlMatch){
      wallpaperImg=new Image();
      wallpaperImg.src=urlMatch[1];
    }else{
      wallpaperImg=null;
    }
    const gradMatch=bg.match(/linear-gradient\([^)]+\)/);
    if(gradMatch){
      const colors=gradMatch[0].match(/#[0-9a-fA-F]{3,8}/g);
      wallpaperGradColors=(colors&&colors.length>=2)?colors:null;
    }else{
      wallpaperGradColors=null;
    }
  }
  function setBlur(px){ blurPx=Math.max(0,px); dirty=true; }
  function markDirty(){ dirty=true; }             /* ★ 外部通知需要重绘 */
  function isDirty(){ return dirty; }
  function clearDirty(){ dirty=false; }
  function init(){
    if(initialized)return;
    initialized=true;
    try{
      const idx=(typeof STATE!=='undefined'&&STATE.theme)?STATE.theme.wallpaper||0:0;
      const bg=(typeof WALLPAPERS!=='undefined'&&WALLPAPERS[idx])?WALLPAPERS[idx].bg:'';
      if(bg)setWallpaper(bg);
    }catch(_){}
  }
  function drawIcon(iconEl, sr, ox, oy){
    const item=iconEl._item;
    if(!item)return;
    const r=iconEl.getBoundingClientRect();
    const x=r.left-sr.left-ox;
    const y=r.top-sr.top-oy;
    if(x+r.width<0||y+r.height<0||x>canvas.width||y>canvas.height)return;
    const pad=r.width*0.1;
    const size=r.width*0.8;
    const radius=size*0.22;
    if(item.isFolder){
      ctx.save();
      roundRect(ctx,x+pad,y+pad,size,size,radius);
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.fill();
      ctx.restore();
      const miniPad=size*0.12;
      const miniSize=(size-miniPad*3)/2;
      for(let i=0;i<4;i++){
        const child=item.children[i];
        if(!child)continue;
        const row=Math.floor(i/2),col=i%2;
        const mx=x+pad+miniPad+col*(miniSize+miniPad);
        const my=y+pad+miniPad+row*(miniSize+miniPad);
        const src=A.apps[child.id];
        if(!src)continue;
        const img=getImg(src);
        if(!img.complete||img.naturalWidth===0)continue;
        ctx.save();
        roundRect(ctx,mx,my,miniSize,miniSize,miniSize*0.2);
        ctx.clip();
        const cx=mx+miniSize/2, cy=my+miniSize/2;
        const drawSize=miniSize*2.2;
        ctx.drawImage(img,cx-drawSize/2,cy-drawSize/2,drawSize,drawSize);
        ctx.restore();
      }
    }else{
      const src=A.apps[item.id];
      if(!src)return;
      const img=getImg(src);
      if(!img.complete||img.naturalWidth===0)return;
      ctx.save();
      roundRect(ctx,x+pad,y+pad,size,size,radius);
      ctx.clip();
      const cx=x+r.width/2;
      const cy=y+r.height/2;
      const drawSize=size*2.85;
      ctx.drawImage(img,cx-drawSize/2,cy-drawSize/2,drawSize,drawSize);
      ctx.restore();
    }
  }
  function render(bbox){
    const w=Math.max(1,Math.ceil(bbox.w));
    const h=Math.max(1,Math.ceil(bbox.h));
    if(canvas.width!==w||canvas.height!==h){
      canvas.width=w;
      canvas.height=h;
    }
    const sr=screen_.getBoundingClientRect();
    const ox=bbox.x, oy=bbox.y;

    /* 应用磨砂模糊 */
    ctx.save();
    if(blurPx>0.1){
      ctx.filter='blur('+blurPx+'px)';
    }

    const grad=ctx.createLinearGradient(0,0,w*0.7,h);
    if(wallpaperGradColors&&wallpaperGradColors.length>=2){
      const n=wallpaperGradColors.length;
      for(let i=0;i<n;i++)grad.addColorStop(i/(n-1),wallpaperGradColors[i]);
    }else{
      grad.addColorStop(0,'#1a1a2e');
      grad.addColorStop(0.35,'#16213e');
      grad.addColorStop(0.65,'#0f3460');
      grad.addColorStop(1,'#533483');
    }
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);

    if(wallpaperImg&&wallpaperImg.complete&&wallpaperImg.naturalWidth>0){
      const iw=wallpaperImg.naturalWidth, ih=wallpaperImg.naturalHeight;
      const scale=Math.max(sr.width/iw,sr.height/ih);
      const dw=iw*scale, dh=ih*scale;
      const dx=(sr.width-dw)/2 - ox;
      const dy=(sr.height-dh)/2 - oy;
      ctx.drawImage(wallpaperImg,dx,dy,dw,dh);
    }

    appPages.querySelectorAll('.app-icon').forEach(ic=>drawIcon(ic,sr,ox,oy));

    const dockRect=dock.getBoundingClientRect();
    const dkx=dockRect.left-sr.left-ox;
    const dky=dockRect.top-sr.top-oy;
    if(dkx+dockRect.width>0 && dky+dockRect.height>0 && dkx<w && dky<h){
      ctx.save();
      roundRect(ctx,dkx,dky,dockRect.width,dockRect.height,26);
      ctx.fillStyle='rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.restore();
      dock.querySelectorAll('.app-icon').forEach(ic=>drawIcon(ic,sr,ox,oy));
    }

    ctx.restore();
  }
  return{init,render,canvas,getImg,setBlur,setWallpaper,markDirty,isDirty,clearDirty};
})();
/* ═══════════════════════════════════════════════════════════════
   WebGLLiquidGlass · V7 局部渲染
   ═══════════════════════════════════════════════════════════════ */
const WebGLLiquidGlass=(function(){
  const MAX_GLASS=12;

  const VERT=`#version 300 es
precision mediump float;
layout(location=0) in vec2 aPosition;
void main(){
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

  const FRAG=`#version 300 es
precision mediump float;
out vec4 fragColor;
#define MAX_GLASS ${MAX_GLASS}
uniform sampler2D uStageTexture;
uniform vec2 uResolution;
uniform vec2 uBBoxOrigin;
uniform vec2 uBBoxSize;
uniform int uGlassCount;
uniform vec4 uGA[${MAX_GLASS}];
uniform vec4 uGB[${MAX_GLASS}];
uniform vec4 uGC[${MAX_GLASS}];
uniform vec4 uGE[${MAX_GLASS}];
float sdRoundBox(vec2 p, vec2 b, float r){
  r=min(r,min(b.x,b.y));
  vec2 q=abs(p)-b+r;
  return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r;
}
float sdSquircle(vec2 p, vec2 b, float exp){
  vec2 n=abs(p)/max(b,vec2(1e-3));
  float d=pow(pow(n.x,exp)+pow(n.y,exp),1.0/exp);
  return (d-1.0)*min(b.x,b.y);
}
float smin(float a, float b, float k){
  if(k<0.01)return min(a,b);
  float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);
  return mix(b,a,h)-k*h*(1.0-h);
}
float sdGlass(vec2 p, int i){
  vec2 rel=p-uGA[i].xy;
  float rBox=sdRoundBox(rel,uGA[i].zw,uGB[i].x);
  float sq=uGE[i].x;
  if(sq>0.01){
    float sqSDF=sdSquircle(rel,uGA[i].zw,max(uGE[i].y,2.0));
    rBox=mix(rBox,sqSDF,sq);
  }
  return rBox;
}
float sdfAll(vec2 p){
  float d=1e9;
  for(int i=0;i<MAX_GLASS;i++){
    if(i>=uGlassCount)break;
    if(uGA[i].z<=0.0||uGA[i].w<=0.0)continue;
    d=smin(d,sdGlass(p,i),uGB[i].y);
  }
  return d;
}
void main(){
  vec2 p = vec2(gl_FragCoord.x, uResolution.y - gl_FragCoord.y) - uBBoxOrigin;
  float d=sdfAll(p);
  float mask=1.0-smoothstep(-1.0,1.0,d);
  if(mask<0.002){fragColor=vec4(0.0);return;}
  float e=1.5;
  vec2 g=vec2(
    sdfAll(p+vec2(e,0.0))-sdfAll(p-vec2(e,0.0)),
    sdfAll(p+vec2(0.0,e))-sdfAll(p-vec2(0.0,e))
  );
  vec2 nrm=g/max(length(g),0.0001);
  float bestD=1e9;
  float bestBlur=0.0;
  float bestRefr=0.25;
  float bestTintA=0.0;
  vec3 bestTintRGB=vec3(0.0);
  float bestHighlight=1.0;
  float bestDisp=0.1;
  for(int i=0;i<MAX_GLASS;i++){
    if(i>=uGlassCount)break;
    if(uGA[i].z<=0.0)continue;
    float di=abs(sdGlass(p,i));
    if(di<bestD){
      bestD=di;
      bestBlur=uGB[i].z;
      bestTintA=uGB[i].w;
      bestTintRGB=uGC[i].rgb;
      bestRefr=uGC[i].w;
      bestHighlight=uGE[i].z;
      bestDisp=uGE[i].w;
    }
  }
  float edge=1.0-smoothstep(0.0,18.0,-d);
  edge=pow(edge,1.5);
  vec2 baseOffset=nrm*bestRefr*60.0*edge;
  vec2 offR=baseOffset*(1.0+bestDisp);
  vec2 offG=baseOffset;
  vec2 offB=baseOffset*(1.0-bestDisp);
  float lod=clamp(bestBlur,0.0,1.0)*6.0;
  vec3 col;
  col.r=textureLod(uStageTexture,clamp((p+offR)/uBBoxSize,0.0,1.0),lod).r;
  col.g=textureLod(uStageTexture,clamp((p+offG)/uBBoxSize,0.0,1.0),lod).g;
  col.b=textureLod(uStageTexture,clamp((p+offB)/uBBoxSize,0.0,1.0),lod).b;
  if(bestTintA>0.0){
    float lum=dot(col,vec3(0.299,0.587,0.114));
    float t=sqrt(lum);
    col+=(bestTintRGB*t-col)*bestTintA;
  }
  vec2 L=normalize(vec2(-0.45,-0.89));
  float diff=max(0.0,dot(-nrm,L));
  float fres=pow(edge,2.2);
  col+=vec3(1.0)*(diff*0.50+0.08)*fres*bestHighlight;
  col+=vec3(1.0)*pow(diff,8.0)*fres*0.70*bestHighlight;
  col+=vec3(1.0)*smoothstep(0.35,1.0,fres)*0.20;
  fragColor=vec4(col,mask);
}`;

  let canvas=null, gl=null, program=null, vao=null, tex=null, uniforms=null;
  let texW=0, texH=0;
  let tex2D=null, tex2DCtx=null;
  let raf=0, running=false;
  let _lastRenderT=0;              /* ★ 上次渲染时间 */
  const FRAME_INTERVAL=33;         /* ★ 30fps 上限 */
  let _lastBBoxKey='';             /* ★ 上一帧 bbox 指纹 */
  const glasses=[];
  const dataA=new Float32Array(MAX_GLASS*4);
  const dataB=new Float32Array(MAX_GLASS*4);
  const dataC=new Float32Array(MAX_GLASS*4);
  const dataE=new Float32Array(MAX_GLASS*4);

  function compile(type, src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  function init(){
    if(canvas)return true;
    const w=screen_.clientWidth;
    const h=screen_.clientHeight;
    canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    canvas.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2000;';
    screen_.appendChild(canvas);
    gl=canvas.getContext('webgl2',{
      alpha:true,premultipliedAlpha:false,antialias:false,
      depth:false,stencil:false,preserveDrawingBuffer:false
    });
    if(!gl){console.warn('[LiquidGlass] WebGL2 不可用');return false;}
    const vs=compile(gl.VERTEX_SHADER,VERT);
    const fs=compile(gl.FRAGMENT_SHADER,FRAG);
    program=gl.createProgram();
    gl.attachShader(program,vs);
    gl.attachShader(program,fs);
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
      console.warn('[LiquidGlass] 链接失败:',gl.getProgramInfoLog(program));
      return false;
    }
    gl.deleteShader(vs);gl.deleteShader(fs);
    uniforms={
      uStageTexture:gl.getUniformLocation(program,'uStageTexture'),
      uResolution:gl.getUniformLocation(program,'uResolution'),
      uBBoxOrigin:gl.getUniformLocation(program,'uBBoxOrigin'),
      uBBoxSize:gl.getUniformLocation(program,'uBBoxSize'),
      uGlassCount:gl.getUniformLocation(program,'uGlassCount'),
      uGA:gl.getUniformLocation(program,'uGA[0]'),
      uGB:gl.getUniformLocation(program,'uGB[0]'),
      uGC:gl.getUniformLocation(program,'uGC[0]'),
      uGE:gl.getUniformLocation(program,'uGE[0]'),
    };
    vao=gl.createVertexArray();
    gl.bindVertexArray(vao);
    const buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    gl.bindVertexArray(null);
    tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0,0,0,0);
    if(!tex2D){
      tex2D=document.createElement('canvas');
      tex2DCtx=tex2D.getContext('2d');
    }
    return true;
  }

  function frame(){
    raf=0;
    if(!running)return;
    if(glasses.length===0){running=false;return;}

    /* ★ 帧率限制：最多 30fps */
    const now=performance.now();
    if(now-_lastRenderT<FRAME_INTERVAL-2){
      raf=requestAnimationFrame(frame);
      return;
    }
    _lastRenderT=now;

    const cw=canvas.clientWidth, ch=canvas.clientHeight;
    if(canvas.width!==cw||canvas.height!==ch){
      canvas.width=cw;canvas.height=ch;
      texW=0;texH=0;
    }
    const sr=screen_.getBoundingClientRect();
    const canvasW=canvas.width, canvasH=canvas.height;
    const scaleX=canvasW/sr.width;
    const scaleY=canvasH/sr.height;

    const visible=[];
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const g of glasses){
      if(!g.element||!g.element.isConnected)continue;
      const cs=getComputedStyle(g.element);
      if(parseFloat(cs.opacity)<0.01)continue;
      if(cs.visibility==='hidden'||cs.display==='none')continue;
      const layoutW=g.element.offsetWidth;
      const layoutH=g.element.offsetHeight;
      if(layoutW<=0||layoutH<=0)continue;
      const rectViewport=g.element.getBoundingClientRect();
      const ratioW = rectViewport.width/layoutW;
      if(ratioW<0.85||ratioW>1.15)continue;
      /* ★ 关键：全部转成 stage 相对坐标，避免双标 */
      const rect = {
        left: rectViewport.left - sr.left,
        top: rectViewport.top - sr.top,
        right: rectViewport.right - sr.left,
        bottom: rectViewport.bottom - sr.top,
        width: rectViewport.width,
        height: rectViewport.height
      };
      visible.push({g,rect,layoutW,layoutH});
      const margin=Math.max(80,Math.max(rect.width,rect.height)*0.9);
      if(rect.left-margin<minX)minX=rect.left-margin;
      if(rect.top-margin<minY)minY=rect.top-margin;
      if(rect.right+margin>maxX)maxX=rect.right+margin;
      if(rect.bottom+margin>maxY)maxY=rect.bottom+margin;
    }

    if(visible.length===0){
      gl.viewport(0,0,canvasW,canvasH);
      gl.disable(gl.SCISSOR_TEST);
      gl.clearColor(0,0,0,0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      if(running)raf=requestAnimationFrame(frame);
      return;
    }

    minX=Math.max(0,minX);
    minY=Math.max(0,minY);
    maxX=Math.min(sr.width,maxX);
    maxY=Math.min(sr.height,maxY);

    /* ★ bbox 无效 → 清空跳过 */
    if(maxX<=minX || maxY<=minY){
      gl.viewport(0,0,canvasW,canvasH);
      gl.disable(gl.SCISSOR_TEST);
      gl.clearColor(0,0,0,0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      if(running)raf=requestAnimationFrame(frame);
      return;
    }

    /* ★ 检查 bbox 是否变化 + 是否有脏标记 */
    const bboxKey=Math.round(minX)+','+Math.round(minY)+','+Math.round(maxX)+','+Math.round(maxY);
    const needRender=bboxKey!==_lastBBoxKey||BackdropTexture.isDirty();
    _lastBBoxKey=bboxKey;

    if(needRender){
      BackdropTexture.render({x:minX,y:minY,w:maxX-minX,h:maxY-minY});
      BackdropTexture.clearDirty();
    }
    const backdropCanvas=BackdropTexture.canvas;
    const sw=backdropCanvas.width, sh=backdropCanvas.height;
    if(tex2D.width!==sw||tex2D.height!==sh){
      tex2D.width=sw;tex2D.height=sh;
    }
    /* ★ 只有需要渲染时才上传纹理 */
    if(needRender){
      tex2DCtx.clearRect(0,0,sw,sh);
      tex2DCtx.drawImage(backdropCanvas,0,0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D,tex);
      if(texW===sw&&texH===sh){
        gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,tex2D);
      }else{
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,tex2D);
        texW=sw;texH=sh;
      }
    }

    const vpX=Math.round(minX*scaleX);
    const vpW=Math.round((maxX-minX)*scaleX);
    const vpH=Math.round((maxY-minY)*scaleY);
    const vpY=Math.round(canvasH - (maxY-minY)*scaleY - (minY*scaleY));

    gl.viewport(vpX,vpY,vpW,vpH);
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(vpX,vpY,vpW,vpH);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    let count=0;
    for(const v of visible){
      if(count>=MAX_GLASS)break;
      const g=v.g;
      const rect=v.rect;
      const localX=(rect.left-minX)*scaleX;
      const localY=(rect.top-minY)*scaleY;
      const localW=rect.width*scaleX;
      const localH=rect.height*scaleY;
      const cx=localX+localW/2;
      const cy=localY+localH/2;
      const i=count;
      const base=i*4;
      dataA[base+0]=cx;
      dataA[base+1]=cy;
      /* ★ 半径也用 rect（缩放后），保持和位置一致 */
      dataA[base+2]=(rect.width/2)*scaleX*1.0625;
      dataA[base+3]=(rect.height/2)*scaleY*1.0625;
      const cornerScale=Math.min(scaleX,scaleY);
      dataB[base+0]=g.cornerRadius*cornerScale;
      dataB[base+1]=g.fuse*cornerScale;
      dataB[base+2]=g.blur/100;
      dataB[base+3]=g.tint[3];
      dataC[base+0]=g.tint[0];
      dataC[base+1]=g.tint[1];
      dataC[base+2]=g.tint[2];
      dataC[base+3]=g.refraction;
      dataE[base+0]=g.squircle?1.0:0.0;
      dataE[base+1]=g.squircleExp||4.0;
      dataE[base+2]=g.highlight/100;
      dataE[base+3]=g.dispersion/50;
      count++;
    }

    gl.useProgram(program);
    gl.bindVertexArray(vao);

    gl.uniform1i(uniforms.uStageTexture,0);
    gl.uniform2f(uniforms.uResolution,canvasW,canvasH);
    gl.uniform2f(uniforms.uBBoxOrigin,
      Math.round(minX*scaleX),
      Math.round(minY*scaleY));
    gl.uniform2f(uniforms.uBBoxSize, vpW, vpH);
    gl.uniform1i(uniforms.uGlassCount,count);

    if(count>0){
      gl.uniform4fv(uniforms.uGA,dataA);
      gl.uniform4fv(uniforms.uGB,dataB);
      gl.uniform4fv(uniforms.uGC,dataC);
      gl.uniform4fv(uniforms.uGE,dataE);
    }

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.bindVertexArray(null);
    gl.disable(gl.SCISSOR_TEST);

    if(running)raf=requestAnimationFrame(frame);
  }

  function start(){
    if(!canvas){if(!init())return;}
    if(running)return;
    running=true;
    if(!raf)raf=requestAnimationFrame(frame);
  }
  function stop(){
    running=false;
    if(raf){cancelAnimationFrame(raf);raf=0;}
  }
  function attach(element, opts){
    if(!init())return null;
    opts=opts||{};
    const g={
      element,
      refraction: opts.refraction!=null?opts.refraction:0.25,
      cornerRadius: opts.cornerRadius!=null?opts.cornerRadius:36,
      highlight: opts.highlight!=null?opts.highlight:100,
      dispersion: opts.dispersion!=null?opts.dispersion:5,
      blur: opts.blur!=null?opts.blur:0,
      tint: opts.tint||[0,0,0,0],
      fuse: opts.fuse!=null?opts.fuse:0,
      squircle: opts.squircle!==false,
      squircleExp: opts.squircleExp||4.0,
    };
    glasses.push(g);
    start();
    return{
      set(patch){Object.assign(g,patch);},
      start,
      stop,
      destroy(){
        const idx=glasses.indexOf(g);
        if(idx>=0)glasses.splice(idx,1);
        if(glasses.length===0)stop();
      }
    };
  }
  return{attach,start,stop};
})();

/* ═══ 颜色提取 / Aura ═══ */
const _auraColorCache={};
function extractColorFromImg(img){
  try{
    const size=24;const c=document.createElement('canvas');c.width=c.height=size;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,size,size);
    const data=ctx.getImageData(0,0,size,size).data;
    let r=0,g=0,b=0,count=0;
    for(let i=0;i<data.length;i+=4){
      const a=data[i+3];if(a<100)continue;
      const br=(data[i]+data[i+1]+data[i+2])/3;
      if(br<40||br>235)continue;
      r+=data[i];g+=data[i+1];b+=data[i+2];count++;
    }
    if(count===0)return null;
    return{r:Math.round(r/count),g:Math.round(g/count),b:Math.round(b/count)};
  }catch(e){return null;}
}
function getAppColor(appId,cb){
  if(_auraColorCache[appId])return cb(_auraColorCache[appId]);
  const src=A.apps[appId];if(!src)return cb(null);
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{const c=extractColorFromImg(img);if(c)_auraColorCache[appId]=c;cb(c);};
  img.onerror=()=>cb(null);img.src=src;
}
function auraStart(appId,sx,sy,presetColor){
  const apply=c=>{
    if(!c)c={r:100,g:150,b:255};
    dragAura.style.background='radial-gradient(circle at center,rgba('+c.r+','+c.g+','+c.b+',.62) 0%,rgba('+c.r+','+c.g+','+c.b+',.34) 30%,rgba('+c.r+','+c.g+','+c.b+',.14) 55%,rgba('+c.r+','+c.g+','+c.b+',.04) 75%,transparent 100%)';
    dragAura.style.opacity='1';auraMove(sx,sy);
  };
  if(presetColor)return apply(presetColor);
  if(_auraColorCache[appId])apply(_auraColorCache[appId]);
  else getAppColor(appId,apply);
}
function auraMove(sx,sy){dragAura.style.transform='translate3d('+(sx|0)+'px, '+(sy|0)+'px, 0)';}
function auraEnd(){dragAura.style.opacity='0';}

/* ═══════════════════════════════════════════════════════════════
   Notify · 通知系统
   ═══════════════════════════════════════════════════════════════ */
const Notify=(function(){
  const MAX=30;
  let list=[];
  let queue=[];           /* ★ 待弹出的通知队列 */
  let popTimer=null;      /* ★ 队列处理定时器 */
  const POP_INTERVAL=1600;/* ★ 每条停留 1.6s */
  try{const s=localStorage.getItem('freeui_notifications');if(s)list=JSON.parse(s);}catch(_){}

  function save(){try{localStorage.setItem('freeui_notifications',JSON.stringify(list));}catch(_){}}
  function render(){renderNC();updateNCBadge();}

  /* 发通知：{title, body, icon, action} */
  function push(opts){
    const n={
      id:'n_'+Date.now()+'_'+Math.floor(Math.random()*1000),
      title:opts.title||'通知',
      body:opts.body||'',
      icon:opts.icon||null,
      time:Date.now(),
      read:false,
      action:opts.action||null,
    };
    list.unshift(n);
    if(list.length>MAX)list.length=MAX;
    save();
    render();
    /* ★ 加入弹出队列 */
    queue.push(n);
    processQueue();
    return n;
  }

  /* ★ 队列处理器：一条一条弹 */
  function processQueue(){
    if(popTimer)return;      /* 正在处理中 */
    if(queue.length===0)return;
    const n=queue.shift();
    /* 灵动岛弹一下 */
    /* ★ 灵动岛最多显示 18 个字符，超出加省略号 */
    const full=n.title+(n.body?' · '+n.body:'');
    const short=full.length>18?full.slice(0,18)+'…':full;
    islandText(short);
    /* 粒子 */
    const sr=screen_.getBoundingClientRect();
    FX.pulse(sr.width/2,60,{count:8,hue:205});
    /* 等这条收起后再弹下一条 */
    popTimer=setTimeout(()=>{
      popTimer=null;
      /* 如果队列里还有，等灵动岛收起后继续 */
      if(queue.length>0){
        setTimeout(processQueue,900);   /* 灵动岛收起后再弹 */
      }
    },POP_INTERVAL);
  }
  function remove(id){
    const i=list.findIndex(n=>n.id===id);
    if(i<0)return;
    list.splice(i,1);
    save();render();
  }

  /* ★ 带粒子飘散的单条删除 */
  function removeAnimated(id){
    const item=document.querySelector('.nc-item[data-id="'+id+'"]');
    if(!item){
      remove(id);
      return;
    }
    const sr=screen_.getBoundingClientRect();
    const r=item.getBoundingClientRect();
    const cx=r.left-sr.left+r.width/2;
    const cy=r.top-sr.top+r.height/2;

    /* 卡片向右上飘走 */
    item.style.transition='transform .55s cubic-bezier(.4,0,.6,1),opacity .45s';
    item.style.transform='translateX(40px) translateY(-30px) scale(.85)';
    item.style.opacity='0';
    item.style.pointerEvents='none';

    /* ★ 同方向（右上）多彩渐变粒子 */
    /* ★ 同方向（右上）多彩渐变粒子 · 数量翻倍 + 高亮 */
    const DIR=-Math.PI/4;
    const COUNT=64;
    for(let i=0;i<COUNT;i++){
      const hueA=(i/COUNT)*330+20;
      const hueB=(hueA+90)%360;
      const a=DIR+(Math.random()-0.5)*0.7;
      const sp=2.2+Math.random()*2.0;   /* 更快 */
      FX.spawn({
        x:cx+(Math.random()-0.5)*r.width*0.9,
        y:cy+(Math.random()-0.5)*r.height*0.9,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp,
        size:3.2+Math.random()*2.2,     /* 更大 */
        hue:hueA,
        hue2:hueB,
        alpha:1.0,                       /* 满亮 */
        life:1.6+Math.random()*1.0,
        decay:0.007+Math.random()*0.005,
        gravity:-0.018,
        friction:0.986,
        trail:7,
      });
    }

    /* 动画结束后再真正删数据 */
    setTimeout(()=>{
      const i=list.findIndex(n=>n.id===id);
      if(i>=0){list.splice(i,1);save();}
      render();
    },450);
  }
  function clearAll(){
    list=[];
    save();render();
  }

  /* ★ 带粒子飘散效果的清空 */
  function clearAllAnimated(){
    const items=document.querySelectorAll('.nc-item');
    if(!items.length)return;
    const sr=screen_.getBoundingClientRect();

    items.forEach((item,i)=>{
      const r=item.getBoundingClientRect();
      const cx=r.left-sr.left+r.width/2;
      const cy=r.top-sr.top+r.height/2;

      /* 卡片本身向上飘散 */
      item.style.transition='transform .6s cubic-bezier(.4,0,.6,1),opacity .5s';
      item.style.transform='translateY(-60px) scale(.85)';
      item.style.opacity='0';

      /* 每张卡片延迟一点，形成波浪感 */
      setTimeout(()=>{
        /* 主爆发 */
        /* ★ 同方向（向上）多彩渐变粒子 · 数量翻倍 + 高亮 */
        const DIR=-Math.PI/2;
        const COUNT=80;
        for(let j=0;j<COUNT;j++){
          const hueA=(j/COUNT)*360;
          const hueB=(hueA+80)%360;
          const a=DIR+(Math.random()-0.5)*0.9;
          const sp=2.6+Math.random()*2.2;
          FX.spawn({
            x:cx+(Math.random()-0.5)*r.width*1.0,
            y:cy+(Math.random()-0.5)*r.height*0.8,
            vx:Math.cos(a)*sp,
            vy:Math.sin(a)*sp,
            size:3.4+Math.random()*2.4,
            hue:hueA,
            hue2:hueB,
            alpha:1.0,
            life:1.8+Math.random()*1.0,
            decay:0.006+Math.random()*0.005,
            gravity:-0.02,

function renderNC(){
  const panel=document.querySelector('.nc-panel');
  if(!panel)return;
  const list=Notify.getAll();

  /* 头部日期保持不动，只重绘列表部分 */
  let listEl=panel.querySelector('.nc-list');
  if(!listEl){
    listEl=document.createElement('div');
    listEl.className='nc-list';
    panel.appendChild(listEl);
  }
  /* ★ 清空按钮（在列表之后） */
  let clearEl=panel.querySelector('#ncClearAll');

    clearEl.id='ncClearAll';
    clearEl.type='button';
    clearEl.textContent='清空全部通知';
    panel.appendChild(clearEl);
  }

  clearEl.style.display=list.length?'flex':'none';

    listEl.innerHTML='<div class="nc-empty">暂无新通知</div>';
    return;
  }

  const now=Date.now();
  const fmt=t=>{
    const d=Math.floor((now-t)/1000);
    if(d<60)return '刚刚';
    if(d<3600)return Math.floor(d/60)+'分钟前';
    if(d<86400)return Math.floor(d/3600)+'小时前';
    return Math.floor(d/86400)+'天前';
  };

  const MAX_VISIBLE=6;      /* ★ 最多显示 6 条 */
  const visible=list.slice(0,MAX_VISIBLE);
  const overflow=list.length-MAX_VISIBLE;

  let html=visible.map(n=>{
    const iconHtml=n.icon
      ? '<img class="nc-item-icon" src="'+n.icon+'" alt="" onerror="this.style.display=\'none\'">'
      : '<div class="nc-item-icon nc-item-icon-fallback">🔔</div>';
    return '<div class="nc-item'+(n.read?' read':'')+'" data-id="'+n.id+'">'+
      iconHtml+
      '<div class="nc-item-body">'+
        '<div class="nc-item-title">'+n.title+'</div>'+
        (n.body?'<div class="nc-item-text">'+n.body+'</div>':'')+
        '<div class="nc-item-time">'+fmt(n.time)+'</div>'+
      '</div>'+
      '<button class="nc-item-close" type="button" data-close="'+n.id+'">✕</button>'+
    '</div>';
  }).join('');

  /* ★ 超出上限显示省略号 */
  if(overflow>0){
    html+='<div class="nc-more">+'+overflow+' 条未显示…</div>';
  }

  listEl.innerHTML=html;
}

let _folderCounter=0;

function createFolder(children,name){return{isFolder:true,id:makeFolderId(),name:name||'文件夹',children:children.slice(0,60)};}
function findDropTarget(dragEl,ghost,cache){
  const pi=STATE.page;let icons;
  if(cache&&cache.pi===pi&&cache.list)icons=cache.list;
  else{const pageEl=appPages.querySelector('.app-page[data-page="'+pi+'"]');if(!pageEl)return null;icons=[...pageEl.querySelectorAll('.app-icon')];if(cache){cache.pi=pi;cache.list=icons;}}
  const gr=ghost.getBoundingClientRect();const gCx=gr.left+gr.width/2,gCy=gr.top+gr.height/2;
  let best=null,bestDist=Infinity;
  for(const ic of icons){
    if(ic===dragEl)continue;
    if(ic.dataset.pi!==String(pi))continue;
    if(ic.classList.contains('app-widget'))continue;
    const r=ic.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const d=Math.hypot(gCx-cx,gCy-cy);
    if(d<r.width*ICON_CONST.DROP_RADIUS&&d<bestDist){bestDist=d;best={el:ic,index:parseInt(ic.dataset.ix,10),pi};}
  }
  return best;
}
function mergeIntoFolder(srcEl,ds,target){
  const origPi=ds.origPi,origIndex=ds.origIndex,targetPi=target.pi,targetIndex=target.index;
  if(origPi<0||origPi>=STATE.totalPages)return;
  const srcItem=STATE.pages[origPi].splice(origIndex,1)[0];
  if(!srcItem)return;
  let adjusted=targetIndex;
  if(origPi===targetPi&&origIndex<targetIndex)adjusted=targetIndex-1;
  const targetItem=STATE.pages[targetPi][adjusted];
  if(!targetItem){STATE.pages[origPi].splice(origIndex,0,srcItem);reflowFrom();return;}
  let folder;
  if(targetItem.isFolder){
    folder=targetItem;
    if(srcItem.isFolder)folder.children.push(...srcItem.children);
    else folder.children.push({id:srcItem.id,name:srcItem.name});
  }else if(srcItem.isFolder){
    folder=srcItem;folder.children.push({id:targetItem.id,name:targetItem.name});
    STATE.pages[targetPi][adjusted]=folder;
  }else{
    folder=createFolder([{id:srcItem.id,name:srcItem.name},{id:targetItem.id,name:targetItem.name}]);
    STATE.pages[targetPi][adjusted]=folder;
  }
  if(folder.children.length>60)folder.children.length=60;
  reflowFrom();markLibraryDirty();
  islandText('已创建文件夹');
}

const FOLDER_PAGE_SIZE=12;
function renderFolderGrid(folder, direction){
  const totalPages=Math.max(1,Math.ceil(folder.children.length/FOLDER_PAGE_SIZE));
  if(STATE.folderPage>=totalPages)STATE.folderPage=totalPages-1;
  if(STATE.folderPage<0)STATE.folderPage=0;
  const start=STATE.folderPage*FOLDER_PAGE_SIZE;
  const pageChildren=folder.children.slice(start,start+FOLDER_PAGE_SIZE);

  /* ★ 创建新页 */
  const newPage=document.createElement('div');
  newPage.className='folder-page';

  pageChildren.forEach((child,idxInPage)=>{
    const realIndex=start+idxInPage;
    const cell=document.createElement('div');
    cell.className='folder-cell';cell.dataset.id=child.id;cell.dataset.cidx=realIndex;
    /* ★ 加包裹层 */
    const imgWrap=document.createElement('div');
    imgWrap.className='folder-cell-img';
    const img=document.createElement('img');img.src=A.apps[child.id]||'';img.draggable=false;
    img.onerror=()=>{img.outerHTML='<div class="folder-cell-fallback"></div>';};
    imgWrap.appendChild(img);
    cell.appendChild(imgWrap);
    const label=document.createElement('span');label.textContent=child.name||child.id;cell.appendChild(label);
    const del=document.createElement('button');del.className='folder-cell-del';del.type='button';del.textContent='×';
    del.addEventListener('click',e=>{e.stopPropagation();removeFromFolder(realIndex);});
    cell.appendChild(del);
    newPage.appendChild(cell);
  });

  /* ★ 清理历史遗留页（除最后一个） */
  const allPages=[...folderModalGrid.querySelectorAll('.folder-page')];
  for(let i=0;i<allPages.length-1;i++){
    try{allPages[i].remove();}catch(_){}
  }
  const currentPage=allPages[allPages.length-1];

  /* ★ 新页初始位置：屏幕外 */
  if(direction&&direction!==0){
    newPage.style.transform='translate3d('+(direction>0?100:-100)+'%,0,0)';
    newPage.style.opacity='0';
  }
  folderModalGrid.appendChild(newPage);

  if(currentPage&&direction&&direction!==0){
    /* 强制重排，让浏览器记住两个元素的初始状态 */
    void newPage.offsetWidth;
    void currentPage.offsetWidth;

    /* 下一帧改目标状态 → transition 播放 */
    requestAnimationFrame(()=>{
      const ease='transform .42s cubic-bezier(.4,0,.6,1), opacity .42s';

      newPage.style.transition=ease;
      newPage.style.transform='translate3d(0,0,0)';
      newPage.style.opacity='1';

      currentPage.style.transition=ease;
      currentPage.style.transform='translate3d('+(direction>0?-100:100)+'%,0,0)';
      currentPage.style.opacity='0';

      setTimeout(()=>{try{currentPage.remove();}catch(_){}},450);
    });
  }else if(currentPage){
    currentPage.remove();
  }

  renderFolderDots(totalPages);
}
function renderFolderDots(totalPages){
  const dotsEl=$('folderModalDots');
  const prevBtn=$('folderNavPrev');
  const nextBtn=$('folderNavNext');
  if(!dotsEl)return;

  /* 只有一页时隐藏导航 */
  if(totalPages<=1){
    dotsEl.innerHTML='';
    if(prevBtn)prevBtn.style.display='none';
    if(nextBtn)nextBtn.style.display='none';
    return;
  }
  if(prevBtn)prevBtn.style.display='flex';
  if(nextBtn)nextBtn.style.display='flex';

  let html='';
  for(let i=0;i<totalPages;i++){
    html+='<div class="f-dot'+(i===STATE.folderPage?' active':'')+'" data-pg="'+i+'"></div>';
  }
  dotsEl.innerHTML=html;

  if(prevBtn)prevBtn.disabled=(STATE.folderPage<=0);
  if(nextBtn)nextBtn.disabled=(STATE.folderPage>=totalPages-1);
}
let _folderLastPage=-1;   /* 防抖：上次翻页的目标 */
function folderGoPage(p){
  if(!STATE.folder)return;
  const item=STATE.pages[STATE.folder.pi]&&STATE.pages[STATE.folder.pi][STATE.folder.index];
  if(!item||!item.isFolder)return;
  const totalPages=Math.max(1,Math.ceil(item.children.length/FOLDER_PAGE_SIZE));
  const newPage=Math.max(0,Math.min(totalPages-1,p));
  if(newPage===STATE.folderPage)return;
  /* ★ 防抖：40ms 内同类方向连续点击忽略 */
  const now=Date.now();
  if(newPage===_folderLastPage&&now-_folderLastTapTime<40)return;
  _folderLastPage=newPage;
  _folderLastTapTime=now;
  const direction=newPage>STATE.folderPage?1:-1;
  STATE.folderPage=newPage;
  renderFolderGrid(item, direction);
}
let _folderLastTapTime=0;
function removeFromFolder(childIndex){
  if(!STATE.folder)return;
  const{pi,index}=STATE.folder;
  const item=STATE.pages[pi]&&STATE.pages[pi][index];if(!item||!item.isFolder)return;
  item.children.splice(childIndex,1);
  if(item.children.length===0){STATE.pages[pi].splice(index,1);reflowFrom();markLibraryDirty();closeFolderModal();return;}
  if(item.children.length===1){const last=item.children[0];STATE.pages[pi][index]={id:last.id,name:last.name};reflowFrom();markLibraryDirty();closeFolderModal();return;}
  renderFolderGrid(item);renderPage(pi);markLibraryDirty();

function removeFromFolderToDesktop(childIndex){
  if(!STATE.folder)return;
  const{pi,index}=STATE.folder;
  const item=STATE.pages[pi]&&STATE.pages[pi][index];if(!item||!item.isFolder)return;
  if(childIndex<0||childIndex>=item.children.length)return;
  const child=item.children.splice(childIndex,1)[0];if(!child)return;
  const targetPi=Math.max(0,Math.min(STATE.totalPages-1,STATE.page));
  STATE.pages[targetPi].push({id:child.id,name:child.name});
  if(item.children.length===0){
    STATE.pages[pi].splice(index,1);closeFolderModal();reflowFrom();markLibraryDirty();
    islandText('文件夹已解散');
  }else if(item.children.length===1){
    const last=item.children[0];STATE.pages[pi][index]={id:last.id,name:last.name};
    closeFolderModal();reflowFrom();markLibraryDirty();
    islandText((child.name||child.id)+' 已移到桌面');
  }else{
    renderFolderGrid(item);reflowFrom();markLibraryDirty();
    islandText((child.name||child.id)+' 已移到桌面');
  }
}

(function initFolderCellDrag(){
  let drag=null;
  function onMove(e){
    if(!drag||e.pointerId!==drag.pointerId)return;
    if(drag.longTimer){
      const d=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);
      if(d>8){clearTimeout(drag.longTimer);drag.longTimer=null;}
      return;
    }
    if(!drag.dragging||!drag.ghost)return;
    drag.ghost.style.transform='translate3d('+(e.clientX-drag.startX)+'px, '+(e.clientY-drag.startY)+'px, 0) scale(1.1)';
    if(!drag._fxT||performance.now()-drag._fxT>32){
      drag._fxT=performance.now();
      const p=screenPoint(e.clientX,e.clientY);
      FX.trail(p.x,p.y,{hue:205,hueSpread:40,count:1,size:3.0,life:.85,jitter:12,spread:.6,rise:.15});
    }
  }
  function onEnd(e){
    if(!drag||e.pointerId!==drag.pointerId)return;
    if(drag.longTimer){clearTimeout(drag.longTimer);drag.longTimer=null;}
    if(drag.dragging&&drag.ghost){
      const panel=folderModal.querySelector('.folder-modal-panel');
      const pr=panel.getBoundingClientRect();
      const outside=e.clientX<pr.left||e.clientX>pr.right||e.clientY<pr.top||e.clientY>pr.bottom;
      if(outside)removeFromFolderToDesktop(drag.idx);
    }
    const saved=drag;drag=null;
    if(saved.ghost)saved.ghost.remove();
    if(saved.cell)saved.cell.style.opacity='';
    window.removeEventListener('pointermove',onMove);
    window.removeEventListener('pointerup',onEnd);
    window.removeEventListener('pointercancel',onEnd);
  }
  function startDrag(){
    if(!drag||drag.dragging)return;
    drag.dragging=true;
    const cell=drag.cell;const rect=cell.getBoundingClientRect();
    const ghost=document.createElement('div');ghost.className='folder-drag-ghost';
    ghost.style.cssText='left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;';

    document.body.appendChild(ghost);drag.ghost=ghost;cell.style.opacity='0.35';
  }
  folderModalGrid.addEventListener('pointerdown',e=>{
    const cell=e.target.closest('.folder-cell');if(!cell)return;

  });
})();

function bindSlider(el,fillEl,onSet,fxOpts){
  if(!el)return;fxOpts=fxOpts||{};
  let active=false;let currentValue=0.5;let lastDustT=0;
  const hue=fxOpts.hue!=null?fxOpts.hue:205;

    const x0=r.left-sr.left,y0=r.top-sr.top,w=r.width,h=r.height;
    const fillTopY=y0+h*(1-currentValue);
    const bounds={x:x0+2,y:y0+2,w:w-4,h:h-4};
    for(let i=0;i<2;i++){
      FX.spawn({
        x:x0+w*.5+(Math.random()-.5)*w*.6,

        vx:(Math.random()-.5)*.18,
        vy:-(.3+Math.random()*.45),

        decay:.011+Math.random()*.007,
        gravity:-.004,friction:.994,bounds
      });
    }
  }
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();active=true;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    const r0=el.getBoundingClientRect();
    currentValue=Math.max(0,Math.min(1,1-(e.clientY-r0.top)/r0.height));

    const update=ev=>{const r=el.getBoundingClientRect();const v=Math.max(0,Math.min(1,1-(ev.clientY-r.top)/r.height));currentValue=v;fillEl.style.height=(v*100)+'%';onSet(v);};

    const up=()=>{active=false;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);};

  });
}

    {transform:'scale(0.86)',offset:.42},

    rafRef.id=requestAnimationFrame(loop);

  const start={tx:options.curX!=null?options.curX:0,ty:options.curY!=null?options.curY:0,scale:options.curScale!=null?options.curScale:1,opacity:options.curOpacity!=null?options.curOpacity:1,radius:options.curRadius!=null?options.curRadius:0};
  const iconEl=findAppIcon(appId);
  const sr=screen_.getBoundingClientRect();
  const W=screen_.clientWidth,H=screen_.clientHeight;
  let targetX=W/2,targetY=H/2;
  if(iconEl){const r=iconEl.getBoundingClientRect();targetX=r.left-sr.left+r.width/2;targetY=r.top-sr.top+r.height/2;}
  const ex=targetX-W/2,ey=targetY-H/2;
  const vx0=options.velocityX||0,vy0=options.velocityY||0;
  const gx=options.dirX!=null?options.dirX:vx0,gy=options.dirY!=null?options.dirY:vy0;
  const gmag=Math.hypot(gx,gy);let dirX=0,dirY=-1;
  if(gmag>0.5){dirX=gx/gmag;dirY=gy/gmag;}
  const vAbs=Math.min(1.6,Math.hypot(vx0,vy0)||Math.abs(vy0));
  const overshoot=Math.min(80+vAbs*140,220);
  const sx=start.tx,sy=start.ty;
  const MAX_OFF=.75;
  const endScale=CLOSE_ANIM.MIN_SCALE;
  glassHide();
  if(iconEl&&iconEl.isConnected)iconEl.animate([{transform:'scale(1)',offset:0,easing:'cubic-bezier(.34,1.6,.64,1)'},{transform:'scale(1.1)',offset:.55},{transform:'scale(1)',offset:1}],{duration:460,fill:'none'});
  appView.style.pointerEvents='none';
  appView.style.transition='none';
  const rafRef={id:0};
  const token=avClaim(()=>{if(rafRef.id){cancelAnimationFrame(rafRef.id);rafRef.id=0;}});
  const finish=()=>{if(!avIsOwner(token))return;if(rafRef.id){cancelAnimationFrame(rafRef.id);rafRef.id=0;}avRelease(token);_finalizeCloseApp(appId,backToHome);};
  const vRaw=Math.hypot(vx0,vy0);
  const v0n=Math.min(vRaw,1.6);const v1n=Math.min(v0n*1.8,1.6);
  const vScale=v0n>0.01?v1n/v0n:1;
  const v0=Math.max(.04,Math.hypot(vx0*.9,vy0*1.0));
  if(v0<0.2){
    const dTotal=Math.max(1,Math.hypot(ex-sx,ey-sy));
    const T=Math.max(280,Math.min(560,dTotal*1.6));
    const t0=performance.now();
    const sstep=t=>t*t*t*(t*(t*6-15)+10);
    const loop=()=>{
      if(!avIsOwner(token))return;
      const u=Math.min(1,(performance.now()-t0)/T);const e=sstep(u);
      const px=sx+(ex-sx)*e,py=sy+(ey-sy)*e;
      const sc=start.scale+(endScale-start.scale)*e;
      const op=start.opacity*(1-e);
      appView.style.transform='translate3d('+px+'px,'+py+'px,0) scale('+sc+')';
      appView.style.opacity=String(Math.max(0,op));
      if(u>=1){finish();return;}
      rafRef.id=requestAnimationFrame(loop);
    };
    rafRef.id=requestAnimationFrame(loop);return;
  }
  const eR=Math.max(Math.abs(sx)/(MAX_OFF*W),Math.abs(sy)/(MAX_OFF*H));
  let shrink;
  if(eR>=1)shrink=0;else if(eR<=.6)shrink=1;else{const t=(1-eR)/.4;shrink=t*t*(3-2*t);}
  const skipOut=shrink<.05;
  let overX,overY,midScale,midOp;
  if(skipOut){overX=sx;overY=sy;midScale=start.scale;midOp=start.opacity;}
  else{const sh=overshoot*shrink;overX=sx+dirX*sh-(ex-sx)*.18;overY=sy+dirY*sh-(ey-sy)*.18;const offR=Math.max(Math.abs(overX)/(MAX_OFF*W),Math.abs(overY)/(MAX_OFF*H));if(offR>1){overX/=offR;overY/=offR;}midScale=start.scale*.62;midOp=start.opacity*.75;}
  let T_out=0,aOut=0,uxOut=0,uyOut=0,dOut=0,v1;
  if(skipOut){v1=v0;}
  else{v1=v0*vScale;const dxO=overX-sx,dyO=overY-sy;dOut=Math.max(1,Math.hypot(dxO,dyO));T_out=Math.max(160,Math.min(480,2*dOut/(v0+v1)));aOut=(v1-v0)/T_out;uxOut=dxO/dOut;uyOut=dyO/dOut;}
  const dxB=ex-overX,dyB=ey-overY;
  const dBack=Math.max(1,Math.hypot(dxB,dyB));
  const T_back=Math.max(200,Math.min(550,2*dBack/v1));
  const aBack=v1/T_back;
  const uxB=dxB/dBack,uyB=dyB/dBack;
  const t0=performance.now();
  const loop=()=>{
    if(!avIsOwner(token))return;
    const elapsed=performance.now()-t0;
    let px,py,sc,op;
    if(elapsed<T_out){const t=elapsed;const s=v0*t+.5*aOut*t*t;px=sx+uxOut*s;py=sy+uyOut*s;const k=Math.min(1,s/dOut);sc=start.scale+(midScale-start.scale)*k*k;op=start.opacity+(midOp-start.opacity)*k*k;}
    else if(elapsed<T_out+T_back){const t=elapsed-T_out;const s=v1*t-.5*aBack*t*t;px=overX+uxB*s;py=overY+uyB*s;const k=Math.min(1,s/dBack);sc=midScale+(endScale-midScale)*k;op=midOp+(0-midOp)*k;}
    else{appView.style.transform='translate3d('+ex+'px,'+ey+'px,0) scale('+endScale+')';appView.style.opacity='0';finish();return;}
    appView.style.transform='translate3d('+px+'px,'+py+'px,0) scale('+sc+')';
    appView.style.opacity=String(Math.max(0,op));
    rafRef.id=requestAnimationFrame(loop);
  };
  rafRef.id=requestAnimationFrame(loop);
}

/* ═══ App 手势 ═══ */
let _appGestureStart=null,_appMoveRaf=0,_appMoveTarget=null,_appScreenH=0,_appScrollEl=null,_appStartScrollTop=0;
attachGesture(appView,{
  guard:()=>STATE.mode==='app',
  ignore:e=>!!e.target.closest('.app-header-icon'),
  onStart:()=>{
    _appScrollEl=appView.querySelector('.app-body');
    _appStartScrollTop=_appScrollEl?_appScrollEl.scrollTop:0;
    _appGestureStart=freezeAppView();
    _appMoveTarget=null;_appScreenH=screen_.clientHeight;
    BG_EFFECT.begin();
  },
  onMove:(e,{dx,dy})=>{
    const s=_appGestureStart;if(!s)return;
    if(_appScrollEl&&_appStartScrollTop>0&&dy>0)return;
    _appMoveTarget={dx,dy,s};
    if(_appMoveRaf)return;
    _appMoveRaf=requestAnimationFrame(()=>{
      _appMoveRaf=0;
      const d=_appMoveTarget;if(!d)return;
      const moveX=d.dx*.9;const moveY=Math.min(0,d.dy*1.0);
      const p=Math.min(1,Math.max(0,-d.dy/(_appScreenH*.35)));
      appView.style.transform='translate3d('+(d.s.tx+moveX)+'px, '+(d.s.ty+moveY)+'px, 0) scale('+(d.s.scale*(1-p*.08))+')';
      appView.style.opacity=String(Math.max(0,d.s.opacity*(1-p*.35)));
      appView.style.borderRadius=(Math.max(0,p*32))+'px';
      appGlassTint.style.transition='none';
      appGlassTint.style.opacity=String(Math.min(.5,p*.6));
      BG_EFFECT.set(p);
    });
  },
  onEnd:(e,{dx,dy,velocity,velocityX,velocityY})=>{
    if(_appMoveRaf){cancelAnimationFrame(_appMoveRaf);_appMoveRaf=0;}
    _appMoveTarget=null;
    const s=_appGestureStart;
    BG_EFFECT.end();
    if(_appScrollEl&&_appStartScrollTop>0&&dy>0){
      appView.style.transition='transform .35s var(--ease-spring), opacity .3s, border-radius .3s';
      appView.style.transform='translate3d(0,0,0) scale(1)';
      appView.style.opacity='1';appView.style.borderRadius='0';
      appGlassTint.style.transition='opacity .35s';appGlassTint.style.opacity='0';
      _appGestureStart=null;_appScrollEl=null;_appStartScrollTop=0;return;
    }
    const curX=s?s.tx+dx*.9:0;
    const curY=s?s.ty+Math.min(0,dy*1.0):0;
    const pDrag=Math.min(1,Math.max(0,-dy/(_appScreenH*.35)));
    const curScale=s?s.scale*(1-pDrag*.08):1;
    const curOpacity=s?s.opacity*(1-pDrag*.35):1;
    const curRadius=Math.max(0,pDrag*32);
    if(s){
      appView.style.transition='none';
      appView.style.transform='translate3d('+curX+'px, '+curY+'px, 0) scale('+curScale+')';
      appView.style.opacity=String(Math.max(0,curOpacity));
      appView.style.borderRadius=curRadius+'px';
    }
    const sp=Math.hypot(velocityX||0,velocityY||0);
    if(dy<-70||velocity<-.5||(sp>.6&&Math.abs(dx)>20)){
      closeApp(true,{velocity,velocityX,velocityY,dirX:dx,dirY:dy,curX,curY,curScale,curOpacity,curRadius});
    }else{
      appView.style.transition='transform .42s var(--ease-spring), opacity .3s, border-radius .3s';
      appView.style.transform='translate3d(0,0,0) scale(1)';
      appView.style.opacity='1';appView.style.borderRadius='0';
      appGlassTint.style.transition='opacity .35s';appGlassTint.style.opacity='0';
    }
    _appGestureStart=null;_appScrollEl=null;_appStartScrollTop=0;
  }
});
attachGesture(homeIndicator,{guard:()=>STATE.sheet===null&&['home','app','switcher'].includes(STATE.mode),onStart:()=>{homeIndicator.style.transition='none';},onMove:(e,{dy})=>{if(dy<0)homeIndicator.style.transform='translateX(-50%) translate3d(0, '+(dy*.35)+'px, 0)';},onEnd:(e,{dy,startMode})=>{
  homeIndicator.style.transition='transform .3s var(--ease-out)';
  homeIndicator.style.transform='translateX(-50%)';
  if(dy>-30)return;

}});

async function initPowerMonitor(){
  if(!window.pywebview?.api?.get_power_status)return;
  let firstCheck=true;
  async function poll(){
    try{
      const status=await window.pywebview.api.get_power_status();
      if(!status?.available)return;
      const wasPlugged=STATE.powerPlugged;
      STATE.powerPlugged=!!status.plugged;STATE.batteryPercent=status.percent;
      updateBatteryDisplay();updateAllWidgets();
      if(firstCheck){firstCheck=false;return;}
      if(wasPlugged===false&&status.plugged===true)playChargingAnimation(status.percent);

function aiExecuteTool(name,args){
  args=args||{};
  switch(name){
    case 'set_wifi':
      TOGGLES.wifi=!!args.state;applyToggleUI();
      return 'WiFi 已'+(args.state?'打开':'关闭');
    case 'set_bluetooth':
      TOGGLES.bt=!!args.state;applyToggleUI();
      return '蓝牙已'+(args.state?'打开':'关闭');
    case 'set_mute':
      TOGGLES.mute=!!args.state;applyToggleUI();
      return '静音已'+(args.state?'开启':'关闭');
    case 'set_airplane':
      TOGGLES.air=!!args.state;applyToggleUI();
      return '飞行模式已'+(args.state?'开启':'关闭');
    case 'set_volume':{
      const v=Math.max(0,Math.min(1,Number(args.level)||0));
      setVolume(v,{showHud:true});
      return '音量已设为 '+Math.round(v*100)+'%';
    }
    case 'open_app':{
      const q=String(args.name||'').trim();
      const all=collectAllApps();
      const found=all.find(a=>a===q)||all.find(a=>a.includes(q))||all.find(a=>q.includes(a));
      if(!found)return '没有找到应用「'+q+'」';
      setTimeout(()=>openApp(found,screen_.clientWidth/2,screen_.clientHeight/2,null),120);
      return '正在打开「'+found+'」';
    }
    case 'set_wallpaper':{
      const idx=WALLPAPERS.findIndex(w=>w.name===args.name);
      if(idx<0)return '没有这个壁纸';
      STATE.theme.wallpaper=idx;
      wallpaper_.style.backgroundImage=WALLPAPERS[idx].bg;
      if(typeof BackdropTexture!=='undefined'&&BackdropTexture.setWallpaper){
        BackdropTexture.setWallpaper(WALLPAPERS[idx].bg);
      }
      return '已切换到「'+WALLPAPERS[idx].name+'」壁纸';
    }
    case 'set_icon_shape':{
      const map={'圆角':'r-r','圆形':'r-c','方角':'r-s'};
      const s=map[args.shape];
      if(!s)return '不支持的形状';
      applyIconShape(s);STATE.theme.shape=s;
      return '图标已变成'+args.shape;
    }
    case 'lock_screen':
      setTimeout(lockScreenAction,100);
      return '即将锁屏';
    case 'open_control_center':
      setTimeout(()=>openSheet('cc'),120);
      return '控制中心已打开';
    case 'get_time':{
      const d=new Date();const w=['日','一','二','三','四','五','六'][d.getDay()];
      return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w+' '+
             String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }
    case 'set_brightness':{
      const v=Math.max(0,Math.min(1,Number(args.level)||0.6));
      wallpaper_.style.filter='brightness('+(0.4+v*0.9)+')';
      const f=document.getElementById('ccBrightnessFill');if(f)f.style.height=(v*100)+'%';
      return '亮度已调到 '+Math.round(v*100)+'%';
    }
    case 'set_grid':{
      const c=Math.max(3,Math.min(6,Number(args.cols)||4));
      const r=Math.max(4,Math.min(7,Number(args.rows)||5));
      applyGrid(c,r);
      return '网格已调整为 '+c+'×'+r;
    }
    case 'remember':{
      const t=String(args.type||'');const c=String(args.content||'').trim();
      if(!c)return '没有内容可记';
      if(t==='name'){AI_MEMORY.setName(c);return '记住了，你叫 '+c;}
      if(t==='preference'){AI_MEMORY.addPref(c);return '记住了你的偏好：'+c;}
      AI_MEMORY.addFact(c);return '记下了：'+c;

    case 'create_note':{

      let list=[];try{list=JSON.parse(localStorage.getItem('ai_notes')||'[]');}catch(_){}

        title:'新建便签',
        body:text,
        icon:A.apps['笔记']||null,
      });
      return '已记录：'+text;
    }
    case 'list_notes':{
      let list=[];try{list=JSON.parse(localStorage.getItem('ai_notes')||'[]');}catch(_){}
      if(!list.length)return '还没有任何便签';
      return '共 '+list.length+' 条：\n'+list.slice(-10).map((n,i)=>'· '+n.text).join('\n');
    }
    case 'set_reminder':{
      const sec=Math.max(1,Math.min(3600,Number(args.seconds)||10));
      const text=String(args.text||'时间到了').trim();
      setTimeout(()=>{

    default:

  }
}

/* ─── 自动检测模型 ─── */
async function aiDetectModel(){
  let list;
  try{
    const r=await fetch(AI_CONFIG.baseUrl+'/api/tags');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    list=(data.models||[]).map(m=>m.name);
  }catch(e){
    throw new Error('无法连接 Ollama：'+e.message+'\n\n请确认 Ollama 已启动（ollama serve）');
  }
  if(!list.length){
    throw new Error('Ollama 里没有任何模型\n\n请先拉一个：\nollama pull qwen2.5:7b');
  }

  // 1. 按优先级匹配
  for(const pref of AI_CONFIG.preferredModels){
    const exact=list.find(m=>m===pref);
    if(exact)return exact;
  }
  for(const pref of AI_CONFIG.preferredModels){
    const base=pref.split(':')[0];
    const fuzzy=list.find(m=>m.startsWith(base+':')||m===base);
    if(fuzzy)return fuzzy;
  }

  // 2. 退而求其次：找任何 qwen / llama / mistral
  const fallback=list.find(m=>/^(qwen|llama|mistral|command)/i.test(m));
  if(fallback)return fallback;

  // 3. 实在没有就用第一个（可能不支持 tools，会有降级）
  return list[0];
}

/* ─── 语音播报 ─── */
let _currentAudio=null;
async function speak(text){
  if(!AI_CONFIG.tts||!text)return;
  // 去掉 markdown / emoji 等朗读不友好的东西
  const clean=text.replace(/[*_`#~]/g,'').replace(/[\u{1F300}-\u{1FAFF}]/gu,'').trim();
  if(!clean)return;

  // 优先用 pywebview 后端 edge-tts
  if(window.pywebview?.api?.tts_speak){
    try{
      const r=await window.pywebview.api.tts_speak(clean);
      if(r&&r.audio_base64){
        if(_currentAudio){try{_currentAudio.pause();}catch(_){}}
        _currentAudio=new Audio('data:audio/mp3;base64,'+r.audio_base64);
        await _currentAudio.play();
        return;
      }
      console.warn('[TTS] edge-tts 返回异常，回退到 speechSynthesis');
    }catch(e){
      console.warn('[TTS] edge-tts 失败：',e,'→ 回退');
    }
  }

  // 兜底：浏览器内置
  if('speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='zh-CN';u.rate=1.05;u.pitch=1.0;
      const voices=speechSynthesis.getVoices();
      const zh=voices.find(v=>v.lang==='zh-CN'&&/Xiaoxiao|Ting|Female|女/i.test(v.name))||
               voices.find(v=>v.lang==='zh-CN');
      if(zh)u.voice=zh;
      speechSynthesis.speak(u);
    }catch(_){}
  }
}

async function aiPlan(recentHistory){
  const sys=

    '闲聊/问答 → {"type":"chat"}\n'+
